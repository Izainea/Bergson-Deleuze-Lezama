<!DOCTYPE html>
<html lang="es" data-edition="public">
<head>
<!-- EDITION_MODE -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bergson · Deleuze · Lezama — Ruta de lecturas</title>
<style>
html[data-edition="public"] .reference-card,
html[data-edition="public"] .book-cover,
html[data-edition="public"] [data-pdf],
html[data-edition="public"] [data-vault],
html[data-edition="public"] #viewer { display:none !important; }
:root{
  --paper:#f5f6fb; --paper2:#eceef8; --card:#ffffff; --ink:#151a2d; --ink2:#454c66; --muted:#7a8099;
  --line:#dfe2ef; --accent:#4b3fd1; --accent2:#e9e7fd;
  --gold:#c76a06; --gold2:#fdf0dc; --teal:#0b8a63; --teal2:#ddf4eb; --violet:#c42a6c; --violet2:#fbe3ee;
  --ok:#0b8a63; --ok2:#ddf4eb;
  --shadow:0 1px 2px rgba(21,26,45,.05),0 10px 28px rgba(21,26,45,.07);
  --serif:"PT Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --sans:"PT Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10121c; --paper2:#171a28; --card:#1b1f30; --ink:#e9ebf5; --ink2:#c0c5da; --muted:#8c92ab;
  --line:#2b3048; --accent:#9d95ff; --accent2:#272449;
  --gold:#f2a94a; --gold2:#3a2a14; --teal:#4fd1a5; --teal2:#14322a; --violet:#f27bb0; --violet2:#3a1a2a;
  --ok:#4fd1a5; --ok2:#14322a; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --paper:#10121c; --paper2:#171a28; --card:#1b1f30; --ink:#e9ebf5; --ink2:#c0c5da; --muted:#8c92ab;
  --line:#2b3048; --accent:#9d95ff; --accent2:#272449;
  --gold:#f2a94a; --gold2:#3a2a14; --teal:#4fd1a5; --teal2:#14322a; --violet:#f27bb0; --violet2:#3a1a2a;
  --ok:#4fd1a5; --ok2:#14322a; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font:17px/1.65 var(--sans)}
button{font:inherit;color:inherit}
a{color:var(--accent)}

.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.shell.split{grid-template-columns:minmax(0,1fr) minmax(0,46%)}
.main{min-width:0}
.viewer{position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:var(--paper2);display:none;flex-direction:column}
.shell.split .viewer{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.vbar .vt{flex:1;min-width:0;font:700 .9rem var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .vt small{display:block;font:400 .72rem var(--mono);color:var(--muted)}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}

header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:10px 28px;max-width:1100px;margin:0 auto}
.brand{font:500 .9rem var(--mono);letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.toplinks{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font:500 .78rem var(--mono);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.wrap{max-width:1100px;margin:0 auto;padding:0 28px 100px}

.hero{padding:44px 0 20px}
.eyebrow{font:500 .74rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:700 clamp(2.1rem,4.8vw,3.4rem)/1.05 var(--sans);letter-spacing:-.02em;margin:10px 0 14px;max-width:16ch}
.hero p.lead{font:400 1.15rem/1.6 var(--sans);color:var(--ink2);max-width:62ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);min-width:150px}
.stat b{display:block;font:700 1.75rem/1 var(--sans)}
.stat span{font:400 .74rem var(--mono);color:var(--muted)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:600 .74rem var(--mono);font-style:normal}
.stat.prog{display:flex;align-items:center;gap:14px}

.map{position:relative;margin:30px 0 10px;padding:26px 22px 18px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.map h2{font:700 1.25rem var(--sans);margin:0 0 4px}
.map .hint{font-size:.92rem;color:var(--muted);margin:0 0 18px}
.line{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.node{position:relative;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 14px 12px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.node:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.node .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .8rem var(--mono);background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.node.ess .num{border-color:var(--accent);color:var(--accent)}
.node.obl .num{border-color:var(--gold);color:var(--gold)}
.node.rec .num{border-color:var(--teal);color:var(--teal)}
.node.opt .num{border-color:var(--violet);color:var(--violet)}
.node.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.node .nt{font:700 1rem/1.25 var(--sans);display:block}
.node .nm{font:400 .7rem var(--mono);color:var(--muted);display:block;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font:400 .74rem var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

.station{padding-top:28px}
.sthead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;margin-bottom:6px}
.bignum{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:600 1.6rem var(--mono);color:#fff;background:var(--accent)}
.bignum.obl{background:var(--gold)} .bignum.rec{background:var(--teal)} .bignum.opt{background:var(--violet)}
.sthead h2{font:700 clamp(1.7rem,3.2vw,2.3rem)/1.12 var(--sans);letter-spacing:-.015em;margin:2px 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:500 .72rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--paper2);color:var(--ink2)}
.badge.ess{background:var(--accent2);color:var(--accent)} .badge.obl{background:var(--gold2);color:var(--gold)}
.badge.rec{background:var(--teal2);color:var(--teal)} .badge.opt{background:var(--violet2);color:var(--violet)}

.idea{margin:22px 0;padding:22px 26px;border-radius:20px;background:linear-gradient(135deg,var(--accent2),var(--paper2));border:1px solid var(--line)}
.idea .lab{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.idea p{font:400 1.32rem/1.5 var(--sans);margin:8px 0 0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:26px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font:700 .95rem var(--sans);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button .ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:500 .68rem var(--mono);background:var(--paper2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button[aria-selected="true"] .ic{background:var(--accent);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{font:700 1.15rem var(--sans);margin:0 0 10px}
.prose{font:400 1.06rem/1.7 var(--sans);color:var(--ink)}
.prose p{margin:0 0 12px}
.muted{color:var(--muted)}

.guide{list-style:none;margin:0;padding:0;position:relative}
.guide:before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--line)}
.guide li{position:relative;padding:0 0 18px 54px}
.guide .gd{position:absolute;left:8px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--accent);display:grid;place-items:center;font:600 .64rem var(--mono);color:var(--accent)}
.guide .gp{font:500 .74rem var(--mono);color:var(--accent);letter-spacing:.04em}
.guide .gh{font:700 1.08rem/1.35 var(--sans);margin:2px 0 4px}
.guide .gx{font:400 1rem/1.6 var(--sans);color:var(--ink2);margin:0}
.look{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font:500 .74rem var(--mono);color:var(--teal);background:var(--teal2);border:0;border-radius:999px;padding:5px 11px;cursor:pointer}

.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.concept{border-radius:16px;padding:16px;background:var(--paper2);border:1px solid var(--line)}
.concept b{display:block;font:700 1.06rem var(--sans);margin-bottom:4px}
.concept span{font:400 .96rem/1.55 var(--sans);color:var(--ink2)}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:6px 0 16px}
.versus .vs{display:grid;place-items:center;font:500 .74rem var(--mono);color:var(--muted)}
.versus .col{border-radius:16px;padding:16px;border:1px solid var(--line)}
.versus .col.a{background:var(--accent2)} .versus .col.b{background:var(--teal2)}
.versus h4{margin:0 0 6px;font:700 1.08rem var(--sans)}
.versus ul{margin:0;padding-left:18px;font-size:.98rem}

.quote{position:relative;margin:0 0 14px;padding:20px 22px 16px 54px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.quote:before{content:"“";position:absolute;left:16px;top:6px;font:700 3.4rem/1 var(--sans);color:var(--accent);opacity:.4}
.quote q{quotes:none;font:italic 400 1.16rem/1.55 var(--sans);display:block}
.quote .qm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font:400 .74rem var(--mono);color:var(--muted)}
.quote .qm button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font:500 .72rem var(--mono);cursor:pointer}
.quote .qm button:hover{border-color:var(--accent);color:var(--accent)}
.quote .why{font:400 .95rem/1.5 var(--sans);color:var(--ink2);margin-top:8px}

.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fc{perspective:900px;height:210px;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:18px;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .front{background:var(--card)}
.fc .back{background:var(--accent2);transform:rotateY(180deg)}
.fc .k{font:500 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.fc .back .k{color:var(--accent)}
.fc .front p{font:700 1.06rem/1.4 var(--sans);margin:0}
.fc .back p{font:400 .98rem/1.5 var(--sans);margin:0}
.fc .tap{margin-top:auto;font:400 .7rem var(--mono);color:var(--muted)}
.selfscore{display:flex;align-items:center;gap:10px;margin:10px 0 0;font:400 .76rem var(--mono);color:var(--muted)}

textarea{width:100%;min-height:180px;font:400 1.02rem/1.6 var(--sans);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.saved{font:400 .74rem var(--mono);color:var(--ok);height:1.2em;margin-top:6px}

.alert{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--gold2);border:1px solid var(--line);margin:0 0 16px;font-size:.98rem}
.alert .ai{color:var(--gold);font-size:1.1rem}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font:700 .92rem var(--sans);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#10121c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#10121c}}
.btn.ghost{background:transparent}
.pdfrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.donebox{display:flex;align-items:center;gap:10px;font:700 .95rem var(--sans);cursor:pointer;padding:10px 14px;border-radius:12px;background:var(--ok2);color:var(--ok)}
.donebox input{width:18px;height:18px;accent-color:var(--ok)}

.timeline{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:10px 0 6px}
.tl{border:0;cursor:pointer;border-radius:10px;padding:10px 2px 8px;font:600 .74rem var(--mono);color:var(--ink2);text-align:center;transition:transform .12s}
.tl:hover{transform:translateY(-2px)}
.tl.m1{background:var(--accent2)} .tl.m2{background:var(--teal2)} .tl.m3{background:var(--gold2)} .tl.m4{background:var(--violet2)}
.tl.on{outline:2px solid var(--ink);outline-offset:1px}
.tl.must:after{content:"●";display:block;font-size:.55rem;color:var(--violet);line-height:1}
.movs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px;font:400 .72rem var(--mono)}
.movs div{padding:8px 10px;border-radius:10px}
.movs b{display:block;font:700 .95rem var(--sans)}
.chapcard{border-radius:18px;padding:22px 24px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.chapcard .ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chapcard .roman{font:600 1.9rem/1 var(--mono);color:var(--accent)}
.chapcard h4{font:700 1.4rem/1.2 var(--sans);margin:0}
.chapcard .pp{margin-left:auto;font:400 .74rem var(--mono);color:var(--muted)}
.chapnav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}

.tree{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.fam{border-radius:18px;padding:16px;border:1px solid var(--line)}
.fam.c{background:var(--accent2)} .fam.o{background:var(--teal2)}
.fam h4{margin:0 0 10px;font:700 1.15rem var(--sans)}
.gen{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.gen .p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font:400 .92rem var(--sans)}
.gen .p.k{border-color:var(--accent);font-weight:700}
.gen .arrow{color:var(--muted);font-size:.8rem;width:100%;padding-left:10px}
.union{text-align:center;padding:14px;border-radius:18px;background:var(--card);border:2px dashed var(--accent);margin-bottom:16px}
.union b{font:700 1.2rem var(--sans)}
.pgroup{font:700 1.15rem var(--sans);margin:22px 0 8px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.person{border-radius:16px;padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.person b{display:block;font:700 1.08rem var(--sans)}
.person em{font:500 .68rem var(--mono);font-style:normal;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.person p{margin:6px 0 0;font-size:.95rem;color:var(--ink2)}
.threads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.thread{border-radius:16px;padding:16px;background:var(--paper2);border:1px solid var(--line)}
.thread b{display:block;font:700 1.08rem var(--sans);margin-bottom:4px}
.thread span{font-size:.96rem;color:var(--ink2)}
.thread .chs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.thread .chs i{font:500 .68rem var(--mono);font-style:normal;padding:3px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line);cursor:pointer}

.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.book{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.book b{font:700 1.04rem/1.3 var(--sans)}
.book span{font:400 .74rem var(--mono);color:var(--muted)}
.book .pdfrow{margin-top:auto;padding-top:6px}
.libgroup{font:500 .74rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.choice{position:relative;border-radius:16px;padding:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.choice input{position:absolute;opacity:0}
.choice.on{border-color:var(--accent);background:var(--accent2)}
.choice b{display:block;font:700 1.05rem var(--sans);margin-bottom:4px}
.choice span{font-size:.95rem;color:var(--ink2)}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checklist input{margin-top:6px;accent-color:var(--accent)}

@media (max-width:1000px){.shell.split{grid-template-columns:minmax(0,1fr)}.shell.split .viewer{position:fixed;inset:0;z-index:60;height:100vh}}
@media (max-width:720px){
  .topin,.wrap{padding-left:16px;padding-right:16px}
  .toplinks .hide-sm{display:none}
  .versus{grid-template-columns:1fr}
  .tree,.movs{grid-template-columns:1fr 1fr}
  .timeline{grid-template-columns:repeat(7,minmax(0,1fr))}
  .sthead{grid-template-columns:1fr}.bignum{width:52px;height:52px;font-size:1.3rem}
}
@media print{header.top,.viewer,.tabs,.foot,.map{display:none}}
</style>

<link rel="stylesheet" href="assets/ruta-extra.css?v=d6903d815f6d">

<body>
<div class="shell" id="shell">
<div class="main">
  <header class="top"><div class="topin">
    <div class="brand">ruta <span>/</span> ponencia</div>
    <div class="toplinks">
      <button class="chip" data-go="mapa">Mapa</button>
      <button class="chip hide-sm" data-go="biblioteca">Bibliografía</button>
      <button class="chip hide-sm" data-go="armar">Armar la ponencia</button>
      <button class="chip" id="export">Descargar notas</button>
      <button class="chip" id="theme" aria-label="Cambiar tema">◐</button>
    </div>
  </div></header>
  <div class="wrap" id="app"></div>
</div>
<!-- LOCAL_VIEWER -->
</div>

<script>
var R="resumenes/";
var PDF={
  berg:{t:"Deleuze, El bergsonismo",s:"Cátedra 1987",f:"",off:function(p){return Math.floor(p/2)}},
  prel:{t:"Lezama, «Preludio a las eras imaginarias»",s:"Confluencias 1988, pp. 370-385",f:"",off:function(p){return Math.max(1,Math.floor((p-370)/2)+1)}},
  par:{t:"Lezama, Paradiso",s:"Texto íntegro con las notas de Eloísa Lezama",f:"",off:function(p){return p}},
  myem:{t:"Bergson, Materia y memoria",s:"Traducción al español",f:"",off:function(p){return p}},

  ["la actualización se lleva a cabo por diferenciación, por líneas divergentes, y crea por su propio movimiento otras tantas diferencias de naturaleza","p. 41","berg",41,"El puente directo con el capítulo V."]],

["I", "m1", "Una noche de asma en la casa del Coronel", "5-19", ["Una noche de octubre, en la casa del jefe de un campamento militar, la criada Baldovina descubre que José Cemí, de cinco años, está cubierto de ronchas y jadea por el asma (p. 5). Sus padres, el Coronel y su esposa Rialta, están fuera, en la ópera (p. 8). Pide ayuda a la otra pareja de criados, el gallego Zoar y Truni, que le aconsejan frotar al niño con alcohol porque creen que lo picó una hormiga león (p. 5). Baldovina lo frota con estopa y luego con un periódico, alumbrándose con un candelabro cuyas gotas de esperma caen sobre el pecho del niño (p. 7-8). Zoar y Truni prueban después un remedio popular: Zoar abraza al niño cruzando los brazos sobre su pecho y su espalda, y Truni besa el centro de la cruz cada vez (p. 9).", "Sola otra vez, Baldovina habla con el niño, que teme quedar marcado: «nadie me querrá besar para no encontrarse con los besos de Truni» (p. 9). José Cemí orina un agua anaranjada y Baldovina teme que se disuelva; luego lo duerme tamborileando en la madera de la cama, como hacía de muchacha en su aldea, y se queda dormida (p. 10). Llegan bajo la lluvia el Coronel y Rialta. Cuando Baldovina les cuenta la noche, el niño ya respira tranquilo y las ronchas han desaparecido, y sus remedios reciben solo silencio (p. 11). Los padres comentan que el niño está vivo «por puro y sencillo milagro» y Rialta promete llevar velas al altar de Santa Flora (p. 11). En la casa duermen también Violante, la hermana dos años mayor, y un primo del Coronel que estudia ingeniería (p. 6).", "A la mañana siguiente Violante se burla de su hermano con una coplilla, «Pepito, Pepito» (p. 11). Rialta conversa con su madre, la señora Augusta, la Abuela, matancera y orgullosa dulcera; José Cemí recuerda los días en que ella ponía a toda la casa, incluido el Coronel, a su servicio para hacer una natilla (p. 11-13). El cocinero es Juan Izquierdo, mulato, soldado en comisión, bebedor, que se jacta de haber aprendido con el chino Luis Leng (p. 13-14). Cuando Rialta le reprocha echar camarones chinos y frescos al quimbombó, Izquierdo alza el cuchillo con ira (p. 14). El Coronel llega con un melón de Castilla, oye el relato de su esposa, da a Izquierdo cuatro bofetadas y lo echa de la casa (p. 15). Los cocineros que lo sustituyen fracasan, y también Zoar y Truni (p. 15-16).", "El narrador presenta al Coronel: hijo de un padre vasco y de una madre hija de ingleses, vivió treinta y tres años y llevaba a su esposa y a sus tres hijos con alegría y severidad (p. 15). Se recuerda luego al padre del Coronel, dueño del ingenio Resolución en Santa Clara, que algunos años, en un día sin fecha fija, reunía a toda la parentela en una fiesta que llamaba «un gossá familia» (p. 16-17). Allí servía platos inventados, como la «pintada a la romana» (p. 16), y contaba historias: la carrera que perdió en Bilbao contra el belga Peter Lambert, que lo decidió a irse (p. 17-18), y el sueño en que durmió recostado en un cordero bajo un flamboyant (p. 18). Entre relato y relato pedía a su esposa: «Otro zapote, Enriqueta» (p. 18). Se anuncia también al hermano de Rialta, que, según el narrador, «ya exigirá, de acuerdo con su peculiar modo, penetrar en la novela» (p. 17).", "Al volver de esa fiesta al campamento, el Coronel y Rialta encuentran cerca de la casa a Juan Izquierdo, borracho y llorando. El Coronel le da un golpe en el hombro y le dice: «Mañana ve a cocinar para que nos hagas unas yemas dobles que no tengan orejas de elefante» (p. 19), con lo que lo devuelve a su puesto; la frase alude a las yemas dobles de las que Izquierdo se había burlado ante Rialta y Augusta (p. 12). La señora Augusta, que ha mirado la escena tras las persianas, «sus gemelos de campaña» según el Coronel, se pone a gritar «Atención, atención» al oírlo subir la escalera, como quien recibe a un rey (p. 19)."], "El asma de José Cemí y la casa organizada alrededor de la figura del Coronel; las dos ramas de la familia (los Cemí, de padre vasco y madre de origen inglés, y la línea de Rialta y la señora Augusta), y el anuncio del hermano de Rialta, Alberto, que tendrá peso más adelante."],
["II", "m1", "Mamita, sus nietos y los viajes del Coronel", "20-35", ["José Cemí, ya de diez años, sale de la escuela del campamento y va pasando una tiza por un paredón; un hombre lo agarra y lo arrastra al patio circular de una casa de vecindad que hay detrás, gritando que él es quien pinta el muro y apedrea la tortuga que sirve de reloj a los vecinos (p. 20-21). Lo rescata Mamita: «¿no te das cuenta que es el hijo del Coronel?» (p. 21). Mamita es una anciana pequeña, hilandera y callada, abuela de Trinidad (Truni), Vivino (Vivo), Tranquilino (Tránquilo) y del ordenanza Moría, a quienes había criado. Salió de Sancti Spíritus en 1910 con una recomendación del coronel Méndez Miranda; el Coronel metió a los nietos en el ejército, llevó a Truni a su casa para jugar con su hija y después dio a Mamita el puesto de conserje de la escuela del campamento (p. 21, 29).", "Sigue una galería de los vecinos del solar, junto a una casa del Vedado (p. 22): Juan Cazar, bombero retirado y ciego, con Petronila y su hija Nila; la austríaca Sofía Kuller, viuda venida a menos, y su hijo Adalberto, que dibuja rostros en los cafés con colores de caracoles; Martincillo, el flautista, afeminado y aficionado a codearse con escritores; Lupita y su hermano epiléptico (p. 22-24). En otro cuarto viven Mamita y Vivo, el nieto menor, perezoso y siempre escapado. Vivo se hace amigo de Adalberto, y entre los dos pintan en la puerta del flautista un dibujo obsceno con una inscripción que alborota a la vecindad (p. 24).", "Tránquilo, el nieto domador de potros, sirve en la casa del capitán Viole, jefe de infantería. Luba Viole, la hermana solterona del capitán, lo acosa mientras él limpia la lámpara de la sala y ella el espejo; Tránquilo sube por la escalera para escapar, y la lámpara acaba rota en el suelo (p. 24-26). Entra el capitán, Luba huye, y él acusa a Tránquilo de brujería: de haber sido acólito en Sancti Spíritus de un tal Rey Lulo y de haber vivido con la vieja Tiorba de unas monedas enterradas (p. 26-27). El narrador aclara que solo era cierta su manera de domar potros. Tránquilo enfermó de lo que llamaban «tuberculosis florida» y murió encendido de color (p. 27).", "Los soldados avisan a Mamita de que Vivo ha desaparecido y que lo pueden fusilar por desertor (p. 28). Ella cruza el campamento en plena agitación militar con una caja de pasteles para el Coronel y le dice: «Coronel, desde hace tres días no sé por dónde anda Vivo, y tengo miedo de que lo fusilen por desertor» (p. 28). El Coronel se ríe, toma un pastel de manzana y le asegura que Vivo está «más contento que cabra en brisa», pues lo mandó a un trabajo en México (p. 29). Mamita siempre vio al Coronel como protector de su familia, con el presentimiento de que la muerte lo rondaba de cerca (p. 29).", "En 1917 el Coronel va a Kingston a hacer prácticas de artillería de costa con su familia, Baldovina, el ordenanza y el médico cubano danés Selmo Copek, un hombre vanidoso (p. 29-30). En la calle, un olor fétido pasa de la axila de un gendarme negro a la de Copek; el mozo de hotel Thomas lo devuelve juntando a los dos hombres (p. 30-31). El Coronel informa que los servicios de Copek son inútiles y sigue con la familia a México (p. 32). Allí el espejo se le empaña sin remedio, ve un diamante oculto en el reloj de un diplomático mexicano, oye a un ciego en Cuernavaca repetir «Por amor de Dios» (p. 32-33), y en Taxco descubre que un enmascarado de coyote que le propone conspirar es Vivo (p. 34). Sigue un sueño que mezcla estas imágenes, y el regreso en barco (p. 34-35)."], "Mamita y sus nietos, gente del campo que depende de la protección del Coronel, y la impresión de que la muerte acompaña siempre al Coronel. Hay también el primer viaje de la familia fuera de Cuba."],
["III", "m1", "La familia Olaya emigrada en Jacksonville", "36-57", ["En julio de 1894, en Jacksonville (Florida), Rialta, de diez años, trepa a un nogal y Florita Squabs le grita: «Rialta, don't steal the nuts» (p. 36). Florita, hija de madre cubana, está casada con el organista Frederick Squabs, que llegó de Carolina del Norte por una afección de la laringe, y es madre de Flery (p. 36-37). Al día siguiente visita a la señora Augusta y habla de destino y voluntad; Augusta le responde desde su fe católica y recuerda a su tío, el canónigo Padre Rosado, cuyas zapatillas ceremoniales recibió en herencia (p. 38-39). Allí aparecen los hijos de Augusta y de don Andrés Olaya: Andresito, el primero, que estudia violín; Alberto, el segundo; Rialta y Leticia, la hermana que la sigue en edad (p. 37, 40). La frase de Flery ante un tapiz, «Mama, a scene in Pompei», se vuelve broma familiar (p. 37).", "Alberto descubre que el organista solo se pone a tocar cuando el pastor le dice «Mr. Squabs, do you want to play the organ?», y la frase se vuelve otra broma de la familia (p. 40). José Cemí oía de niño hablar de las cosas de «cuando la emigración, o allá en Jacksonville» como de un lugar remoto (p. 40). En el límite de la memoria familiar está la Abuela Cambita, doña Carmen Alate, madre de Augusta, «la hija del oidor» de la Audiencia de Puerto Rico (p. 41). Don Andrés encuentra roto en el patio el atril de Andresito; las hermanas acusan al muchacho de fumar en vez de estudiar, y él replica que ellas juegan a las barajas en casa de Florita. El padre lo trata con una broma, sin reprenderlo (p. 41-42).", "Se cuenta el pasado de Andrés Olaya. Huérfano de padre, trabajó joven como secretario de su pariente, el millonario Elpidio Michelena, casado con Juana Blagalló (p. 43). Cuando un criado chino y el cocinero Manuel se burlan de él en la mesa, Olaya los enfrenta, y Michelena le pide que rece con ellos a la Virgen de la Caridad para tener hijos (p. 43-44). En Matanzas, Michelena mantiene a una amante cantante, Isolda, en una finca; el narrador cuenta una noche de fiesta casi alucinatoria donde Isolda aparece como un manatí y el chinito, llamado Buñuelo de Oro, recita sentencias, entre los músicos Joan Albayat y Luis Mendil (p. 44-49). Al fin Juana espera gemelos; Michelena se arruina y Olaya se enriquece. El separatismo de la vieja Mela y su propio orgullo lo llevan a emigrar a Jacksonville (p. 49-50).", "Don Belarmino pide que Andresito, de quince años, toque el violín en la tómbola de los emigrados; Augusta se niega porque el muchacho es tímido, pero don Andrés la convence (p. 50-52). Florita prepara la fiesta de los doce años de Flery, y Mr. Squabs, que no encuentra al mecánico, va a buscar a su ayudante Carlitos y se lo lleva a la fuerza cuando aún clavaba la baranda del elevador de la tómbola (p. 50-54). Andresito toca una passacaglia de Bach y luego sube al elevador lleno de gente; la plancha mal clavada cede y él cae y muere sangrando por la boca. El coro de los presentes repite: «¿por qué tenía que ser el hijo de don Andrés?» (p. 54).", "En la fiesta de Flery, Squabs trae a Carlitos, de dieciocho años; tres años después, Carlitos rapta a Flery y nunca más se sabe de ellos (p. 55). Squabs enloquece: saluda en el templo vacío a fieles inexistentes y pregunta por Carlitos de casa en casa (p. 55). Alberto, ahora el hijo varón mayor, espía a los vecinos con unos anteojos y canta coplas obscenas con el violín de Andresito convertido en guitarra; tras las quejas de los vecinos, don Andrés lo manda de regreso a La Habana (p. 55-56). Muere la Abuela Cambita después de una larga agonía; antes pide por señas a un hijo suyo, abogado de provincia, su anillo de diamante, que queda en su dedo. En el velorio Alberto le arroja la joya al pecho (p. 56-57)."], "La rama materna (Olaya) y sus emigraciones, que la familia recuerda como un tiempo aparte; la muerte de Andresito, que deja a Alberto como hijo varón mayor, y el carácter rebelde y burlón de Alberto."],
["IV", "m1", "La adolescencia del Coronel y su llegada al colegio", "58-79", ["El narrador vuelve a la niñez del padre de José Cemí hasta su encuentro con la familia de Rialta: el hermano de Rialta fue su primer amigo, y la señora Augusta fue para él casi una madre, pues era huérfano desde los diez años (p. 58). En La Habana de 1902, José Eugenio Cemí tiene doce años y vive con sus tres hermanas bajo el cuidado de su abuela, doña Munda; con ellos está el tío Luis Ruda, hijo de Munda, llegado del Central Resolución, aficionado a la ópera y de habla rústica (p. 58-59). La casa se sostiene con la pensión de los cuatro huérfanos. José Eugenio desafía al tío a pronunciar «reloj» a cambio del suyo, y como no lo logra se lo tira; Luis lo atrapa y esa noche se venga llegando tarde de la ópera (p. 59).", "Molesto por los gastos del tío Luis, José Eugenio le reclama a su abuela que él y sus hermanas vivan como pobres mientras el tío compra hebillas francesas (p. 60). Doña Munda responde con un largo relato: su familia cultivaba tabaco en Vuelta Abajo y el vasco, padre de José Eugenio, se la llevó al Central Resolución (p. 60-61). Él tenía treinta y siete años y su hija Eloísa diecisiete al casarse (p. 61). Eloísa, de salud delicada, pasó unos meses en Viñales en casa de su hermana Enriqueta y murió en dos semanas de un tifus que se atribuyó a la miel de palma (p. 62). El viudo lo tomó como ofensa de Dios: «Dios no me debía haber hecho esto» (p. 62), y antes de morir añadió: «Ni yo tampoco debería haber hecho esto» (p. 63). José Eugenio sale dando un portazo (p. 63).", "Desde la galería de persianas, José Eugenio observa a los nuevos vecinos del piso de al lado, recién llegados del extranjero (p. 63-64). Uno de ellos, de su misma edad, es Alberto Olaya, llegado de Jacksonville y ahora hijo varón mayor tras la muerte de Andresito (p. 64). Alberto va a fumar a la esquina de San Nicolás y Lagunas, indiferente a dos muchachas de un balcón y a su padrastro (p. 64-65), y al volver le dice a José Eugenio, sin mirarlo: «Me molesta cuando miro hacia arriba, que se me pongan delante dos piernas» (p. 66). Por las persianas José Eugenio entrevé a la familia: el brazalete de doña Augusta, el sombrero de jipi de Rialta, don Andrés dormitando en su escritorio y la vieja Mela, madre de don Andrés, asmática, que se alivia con naranjas y crémor puestas al rocío (p. 66-67).", "Los domingos, el tío Luis visita a doña Munda cuando José Eugenio ha salido. Se queja de tener que esquivar al muchacho y advierte que un primo del vasco puede pedir la tutela según una cláusula del testamento (p. 67-68). Munda responde que la responsabilidad ante Dios es suya, y defiende a José Eugenio, que tiene la delicadeza de su madre y la energía de su padre (p. 68). Al final decide que el muchacho entre pupilo en un colegio y que Luis, ya de unos treinta años, vaya a trabajar a Veracruz por gestión del primo de José María Cemí (p. 69-70). El narrador recuerda además que, años después, el tío Alberto rompía objetos de la casa cuando discutía con su madre, Augusta, por la venta de unas acciones de la Western Union (p. 71).", "El primer día de colegio José Eugenio ve en su aula a Alberto, su vecino, indiferente y charlatán (p. 72). Escasea el libro de inglés y los alumnos tienen que cambiar de sitio para compartirlo. Fibo, un muchacho moreno y flaco, aprovecha para pinchar a los compañeros con una pluma de hilos de colores, y a la palabra «freeze, froze, frozen» pincha al rico y presumido Enrique Aredo, que grita en el instante en que suena el timbre (p. 73-75). En el recreo Aredo presume de la finca de su padre y de su cartera de piel rusa (p. 75-76). En el refectorio el director, Jordi Cuevarolliot, reparte el pan lanzando rodajas a los alumnos para sorprender a los distraídos (p. 76-77). El rumor de las duchas y de los cuerpos de los alumnos mayores queda en la memoria de José Eugenio unido al deseo (p. 78-79)."], "El origen de la familia paterna (el vasco José María Cemí, Eloísa y doña Munda) y la amistad entre José Eugenio y Alberto Olaya, que une las dos familias y prepara el matrimonio con Rialta. También aparece el colegio como lugar de iniciación."],
["V", "m1", "Alberto Olaya y José Eugenio se hacen amigos", "80-101", ["El capítulo retrocede a la adolescencia de José Eugenio Cemí, el futuro Coronel y padre de José Cemí, alumno de un colegio habanero dirigido por Jordi Cuevarolliot. Un sábado José Eugenio conversa con su compañero Fibo, el que había pinchado con la pluma a Enrique Aredo en clase. Fibo confiesa que admira a Alberto Olaya, y le cuenta que Olaya lo defendió por ser su vecino; José Eugenio, que nunca había hablado con él, se alegra (p. 81). En la clase de inglés Alberto pregunta por un verso de Browning, la clase estalla en risas y Cuevarolliot lo castiga a encerrarse en un baño (p. 83). Allí Alberto se duerme desnudo bajo la ducha. Aredo lo ve y se lo cuenta a Fibo, que clava en el pizarrón un compás de Aredo (p. 85). Alberto huye y Cuevarolliot encuentra el baño vacío (p. 86).", "Alberto va al parque de los caballitos. Un viejo encargado de los carros le quita a una muchacha de unos dieciséis años su flor de pitahaya y se la pone en la oreja; Alberto la consuela con un lapicero traído de Jacksonville (p. 88). En un cine el mismo viejo le pone la mano en el sexo y Alberto lo golpea (p. 88-89). Entra luego en el bar Reino de siete meses, donde acechan cuatro bromistas y un joven cuatro o cinco años mayor que él le habla de Kierkegaard y de Osiris (p. 89-90). Ese joven, todavía sin nombre, es Oppiano Licario: dice haber dado al dueño la frase latina de la puerta, «Sólo le abro la puerta al rey» (p. 90), y le revela la burla que los otros preparan para él (p. 90-91). Alberto mira al grupo con las manos en jarra, escupe y se marcha (p. 91).", "A medianoche Alberto vuelve al parque y encuentra a la muchacha de la pitahaya. Ella le cuenta que vino de su pueblo y vive con una prima casada que pasa las noches de fiesta (p. 92). Los dos toman un coche hacia la dirección que el joven del bar había mencionado, unas casas de yagua donde los recibe una muchacha coja con un llavero, y entran juntos en una de las glorietas (p. 92). Es la primera noche que Alberto pasa fuera de casa. Por la mañana Cuevarolliot se presenta en casa de los Olaya, pero doña Augusta, la madre, no lo deja pasar de la puerta. Le explica que su esposo Andrés es diabético, que su primer hijo varón murió y que Alberto ha heredado «el diablo de mi hermano Federico» (p. 93). Cuevarolliot se va humillado y borra el nombre de Alberto de su lista (p. 94).", "Esa noche Alberto invita a José Eugenio, que vive en la casa contigua con su Abuela Munda y sus hermanas, a espiar desde la calle un baile en casa de Paulita Nibú, hija de tabaqueros ricos. Allí está Rialta, hermana de Alberto, y José Eugenio la observa por la persiana (p. 94). Llega el Presidente, y Rialta lo saluda: «¿No se acuerda de mí, don Tomás?». Él recuerda las Navidades de Jacksonville y la muerte del hermano de ella, Andresito, y pide que traigan sus restos a Cuba (p. 95). En casa, José Eugenio habla con la Abuela Munda sobre los vecinos criollos. Ella compara la cortesía del padre de los Olaya con la de «tu padre el vasco» (p. 96-97). Mientras tanto Rialta le pregunta a Alberto quién era su amigo, y él responde que es huérfano, hijo del dueño del central Resolución (p. 97).", "Un atardecer salen gritos de la casa de los Olaya. Un médico militar ha perdido la razón, ha matado a su ordenanza y ha huido a casa de su novia (p. 98-100). Era el doctor Zunhill, novio de Carmen, hija de doña Augusta, y la amenazó con un revólver descargado y luego con una bayoneta. Los soldados se lo llevan amarrado. La Abuela Munda baja con José Eugenio y sus nietas a ofrecer ayuda y conoce a la familia: doña Augusta, la Abuela Mela, madre de Andrés Olaya, y el propio Andrés, que sigue recordando a Andresito (p. 99). Andrés invita a José Eugenio a estudiar por las noches con Alberto: «Matemática, música y chocolate» (p. 100). José Eugenio siente que se ha tendido un puente entre las dos familias (p. 100). Al volver, Munda lee una carta de su hijo Luis Ruda llegada de Veracruz (p. 101)."], "Aquí se forma la alianza entre los Cemí y los Olaya, a través de la amistad de José Eugenio con Alberto y su primera visión de Rialta. Oppiano Licario aparece por primera vez, sin nombre, como el joven del bar que protege a Alberto."],
["VI", "m1", "Boda de los padres, infancia de Cemí y muerte del Coronel", "102-142", ["La Abuela Mela, madre de Andrés Olaya, tiene noventa y cuatro años y confunde a vivos y muertos de distintas épocas (p. 102). Se recuerda un episodio de la guerra de independencia: soldados españoles registraron su casa buscando armas sin encontrarlas, y al día siguiente ella entregó a los insurrectos trescientos rifles enterrados en el gallinero (p. 103). José Eugenio, de unos veinte años, es invitado por primera vez a almorzar con los Olaya (p. 104-105). Mela, que desconfía de él por hijo de vasco, insiste en que se canten los himnos de la emigración y entona ella sola uno contra los españoles (p. 106). José Eugenio le contesta con calma que esos cantos le recuerdan a la familia de su madre, los Méndez, entre ellos el coronel Méndez Miranda, primo de ella (p. 106). Mela se levanta enojada y se encierra en su cuarto (p. 107).", "Empujado por Alberto hacia las matemáticas, José Eugenio estudia ingeniería, hace una tesis sobre la triangulación de Matanzas y entra primero en la oficialidad del ejército de la república naciente (p. 107). El día de su boda con Rialta lo visten su tío Luis Ruda, que va a partir hacia unas minas cerca de Santiago, y la Abuela Munda (p. 108-109). En casa de los Olaya, el vestido de novia es obra de madame Casilda, y las botas, demasiado pequeñas, las consigue calzar la costurera Victoria. Paulita Nurias, amiga de Rialta, trae el abrochador de plata que faltaba (p. 110-111). Andrés Olaya ha muerto, así que lleva a Rialta al altar como padrino el coronel Méndez Miranda (p. 110). Rialta tiene veinte años. La boda es en la iglesia de Montserrate, y a la salida los estudiantes cantan en broma «Cemí, Cemí, / no venimos a tu boda» (p. 111).", "Ya casado, José Eugenio asusta con armas a Demetrio, hermano menor de doña Augusta, a quien apoda Guasa Bimba. Un día dispara contra él un rifle que creía descargado y falla (p. 112-115). En una canoa en la playa, el Coronel, de treinta años, enseña a nadar a su hijo José Cemí, de cinco años (p. 115), junto al niño Néstor Rigal. El Coronel le dice: «Te tiras al agua y te aguantas de este dedo» (p. 115). Retira el dedo y el niño se hunde hasta que lo saca un marinero (p. 116). Ya director del castillo del Morro, hace nadar en una piscina profunda a su hija mayor, Violante, que también se hunde y es sacada con unas varas de tridente (p. 116-117). Para curar el asma de su hijo, el Coronel lo mete en una bañera con hielo; el niño casi se desmaya y Rialta lo reanima (p. 119).", "Después del baño helado Cemí sueña con un pez que le toma el dedo y con el rostro de su madre (p. 120-121). En otra escena confunde dos grabados y le dice a su padre: «Un bachiller es una rueda que lanza chispas» (p. 122). El Coronel combate el bandolerismo en Cruces, Remedios y Placetas, y se gana a la tropa comiendo un pollo que los bandidos habían marcado como envenenado (p. 122-124). Mientras tanto Rialta enferma de tifus, y doña Augusta va a cuidarla. Ya convaleciente, cuenta que vio el cadáver intacto de su padre, jefe de policía de Matanzas, deshacerse en polvo al ser exhumado (p. 127). Cemí, que lo oye a escondidas, ve luego en la iglesia de la Merced la figura de cera de Santa Flora (p. 128). Duerme junto a la criada Baldovina, y su padre lo asusta con una canción de muertos (p. 130).", "El Coronel es enviado a Pensacola, al campamento de Fort Barrancas (p. 131). Allí Cemí vive un juego erótico con la vecina Grace Ginsley y pelea con su hermano Thomas (p. 132-133). El Coronel brilla en unos ejercicios de tiro, pero en diciembre cae con la gripe (p. 134-135) y, obedeciendo su propio bando, se interna en el hospital. Rialta está embarazada de su segunda hija (p. 135). En el hospital lo felicita un cubano convaleciente que conoció a Alberto en el bar Reino de siete meses (p. 136-137). Esa noche, agonizante, el Coronel lo hace llamar y le pide: «Tengo un hijo, conózcalo» (p. 139). El hombre responde: «Me llamo Oppiano Licario» (p. 139). El Coronel muere con treinta y tres años (p. 141). Ante el cadáver, Cemí se sostiene en los ojos de Licario, que pasa por la puerta (p. 142)."], "La muerte del Coronel en soledad, con Licario como único testigo y con el encargo de conocer a su hijo, es el hecho central del que parte el resto de la novela. También reaparecerán el asma de Cemí, el agua y el ahogo (el dedo retirado, la piscina, la bañera helada) y las imágenes de la muerte (el polvo de la exhumación, la cera de Santa Flora)."],
["VII", "m1", "La cena familiar en Prado y la muerte de Alberto", "143-179", ["Ya viuda, Rialta vive con sus tres hijos en la casa de doña Augusta en el Paseo del Prado. En la sala cuelgan los retratos de los abuelos paternos de Cemí: el vasco don José María y su esposa, hija de ingleses (p. 144). Una mañana el tío Alberto, borracho, alborota en la esquina y golpea la puerta. Rialta y Baldovina se esconden, pero doña Augusta lo hace pasar. Le reprocha que solo venga a pedir dinero para el jai-alai, le deja los billetes en una silla y se va dándole la espalda (p. 145). Luego Rialta se sienta en el suelo a jugar a los yaquis con sus hijos Violante, Eloísa y José Cemí. En las losas del patio los cuatro ven aparecer la guerrera del Coronel y después su rostro (p. 146-147). Rialta llora por fin hasta desahogarse (p. 147).", "Llega el dentista Demetrio, hermano de Augusta, y anuncia la visita de Leticia, hija de Augusta, y de su esposo, el médico Santurce (p. 147). El narrador cuenta el pasado de Demetrio en Isla de Pinos, donde conoció a Santurce y a Blanquita, la coima mestiza de un billar. Blanquita le predijo una casa en el Cerro y acabó casándose con él (p. 149-150). Alberto lleva a Cemí a esa casa, donde un mono y un azulejo desaparecen entre una visita y otra (p. 150). Esta vez Alberto llega bañado y elegante. La familia lo consiente, y sus hermanas Rialta, Leticia y Matilde lo admiran (p. 153). Demetrio lee en voz alta una carta que Alberto le envió años atrás: una enumeración burlesca de peces firmada «Alberto, rex puer» (p. 153-155). Al oírla, Cemí descubre por primera vez el poder de las palabras de su tío (p. 156).", "Santurce y Leticia llegan con sus dos hijos, panqués y la colección de muñecas de Leticia (p. 157). Santurce habla de cuotas azucareras, y Alberto le gana una partida de ajedrez con unas piezas de jade compradas por Andrés Olaya en París. Las piezas se abren, y Alberto finge leer refranes en papelitos que salen de ellas (p. 158-160). Dedica la partida a la memoria del Coronel (p. 160). Después Cemí comprueba que los papelitos estaban en blanco (p. 160). Leticia humilla a Rialta delante de su criada Concha recordándole una deuda, y Augusta la reprende (p. 161). En la siesta las hermanas se reconcilian (p. 161). Por la noche, en noviembre, Augusta preside una cena de gala. Demetrio mancha con remolacha el mantel heredado de Cambita, su madre, y Alberto cubre las manchas con langostinos, uno de ellos pedido a Cemí (p. 164-166).", "Después de la cena Santurce se lleva a Alberto a un café de la calle San Miguel y le dice que doña Augusta, cerca de los ochenta años, tiene un carcinoma en el seno izquierdo (p. 168-169). En el café está un hombre alto de pelo negrísimo que quiere hablar con Alberto. Es el mismo que lo protegió la noche de su fuga del colegio, aunque no se le nombra. Al ver que Santurce no se aparta, se va (p. 168-169). Un guitarrista vestido de charro canta coplas de muerte mirando a Alberto, que le responde con otra. El charro le lanza un puñal que se clava en la mesa, con la inscripción «Te seguiré buscando» (p. 171). En la estación, el capitán, antiguo cadete del Coronel en El Morro, cuenta cómo se fugó del castillo (p. 172-174). Alberto llora al recordar al Coronel (p. 174).", "El capitán lo libera junto con el charro y lo envía en un automóvil de alquiler a casa del teniente Hervás, a quien llama su cuñado (p. 174). Por el camino Alberto recoge a otro guitarrista, que canta décimas al amanecer camino de Marianao (p. 175-178). El chofer no ve la barrera de un cruce y un tren arrastra el auto. Alberto muere del golpe (p. 178). El guardavía le cubre la cara con su pañuelo, con las iniciales bordadas por doña Augusta (p. 178). Esa misma mañana, sin saber nada todavía, Rialta recibe aliviada el cheque de la pensión, su único ingreso (p. 178). Cemí, que sale para el colegio, recuerda la mano de su tío tomando el langostino. Ahora imagina el langostino avanzando hacia un cementerio de coral (p. 179)."], "Alberto queda como figura del lenguaje inventivo y del juego (la carta de los peces, los papelitos en blanco), y su muerte inicia la disgregación de la familia que doña Augusta mantenía unida. Licario vuelve a aparecer, sin nombre, como el hombre de pelo negro del café, la noche de la muerte de Alberto."],
["VIII", "m2", "El colegio, el viaje a Santa Clara y el encuentro con Fronesis", "180-201", ["En el colegio de José Cemí, el alumno Farraluque, encargado de vigilar el desfile de los menores hacia el servicio, exhibe allí su miembro mientras baila. Una criada del director lo observa desde las persianas y lo denuncia a la esposa del director; Farraluque es degradado y castigado sin salidas dominicales (p. 180). En el bachillerato, el guajiro Leregas muestra en la clase de geografía una erección que toda la fila contempla bajo la mesa del profesor, y esa mañana coloca encima tres libros. Al salir, el profesor le da dos bofetadas; Leregas no reacciona y termina expulsado del colegio (pp. 182-183). Cemí, que fue testigo, recuerda sobre todo la boca del muchacho (p. 183).", "Farraluque cumple tres domingos de castigo. El primero, la criada española del director lo lleva de la mano a la casa del director, con el pretexto de que ayude a pintarla; allí tiene relaciones con la cocinera, una mestiza de diecinueve años que finge dormir, y después con la propia española, que preserva su virginidad mediante el coito anal (pp. 183-185). La cocinera cuenta lo ocurrido a la criada de la casa de enfrente, y esta a su señora, que vive en el tedio con su marido (pp. 185-186). El segundo domingo, Adolfito, hermano de la cocinera, lo lleva a esa casa: la señora le practica sexo oral y Farraluque la detiene tirándole del pelo; en otro cuarto Adolfito lo provoca y lo esquiva (pp. 186-188).", "El tercer domingo Adolfito le entrega una llave: «alguien» quiere conocerlo. En una carbonería de la calle Concordia lo espera un hombre maduro, desnudo y con antifaz, que se le entrega y en su frenesí derriba los sacos, hasta que el carbón se desploma sobre los dos (pp. 189-190). Adolfito le revela después que era el esposo de la señora de enfrente (p. 191). Llegadas las vacaciones de Navidad, Cemí encuentra en casa a su tía Leticia exigiendo a su madre, doña Augusta, que la acompañe a Santa Clara; la abuela se queja de tener que abandonar su casa y a sus otros hijos (p. 191). Leticia pide llevarse también a «Joseíto» dos semanas al campo, por su asma, y Rialta, la madre de Cemí, consiente (p. 192).", "En la estación, Cemí, que desde la muerte de su padre asocia toda separación con la muerte, mira el rostro sereno de su madre y, a su lado en el tren, el de la abuela, ya minado por la enfermedad (p. 193). En Santa Clara, Leticia ha invitado a Ricardo Fronesis, hijo de un abogado de provincia dedicado a su biblioteca y amigo profesional del marido de Leticia, el doctor Santurce (pp. 194, 196). Fronesis llega a las siete de la mañana y Cemí, desvelado, lo recibe; nota en él una cortesía y una seguridad que no había encontrado en nadie (p. 194). En la visita al ingenio Tres suertes, del coronel Castillo Dimas, Fronesis le señala a un adolescente pelirrojo y tuerto, «Godofredo el Diablo» (pp. 195-196). Al día siguiente lo cita en el café Semíramis: «Sintió cómo la palabra amistad tomaba carnalidad» (p. 197).", "En el café vuelve a pasar Godofredo, y Fronesis cuenta su historia, que su padre conoce como abogado del pueblo (p. 197). A los quince años Godofredo deseaba a Fileba, esposa de Pablo, jefe de máquinas del ingenio, diecisiete años mayor que ella y bebedor (pp. 197-198). Rechazado, descubrió que Fileba se veía con el padre Eufrasio, un cura trastornado por el estudio de la concupiscencia en San Pablo, que buscaba un orgasmo doloroso y sin cercanía; Godofredo llevó a Pablo a comprobar la traición y luego espió por una rendija la escena, en la que Eufrasio se estrangulaba los testículos con una soguilla mientras Fileba lloraba (pp. 198-200). Esa noche Pablo se degolló con su guámpara en la cama (p. 200). Godofredo huyó y una liana le marcó una cruz en el ojo derecho: perdió el ojo y la razón (pp. 200-201)."], "Aquí empieza la amistad con Ricardo Fronesis, y con ella la costumbre de conocer a las personas por relatos de su pasado. Leregas reaparece en la universidad (cap. IX); la enfermedad de doña Augusta y el empeño de Leticia en llevársela a Santa Clara siguen abiertos."],
["IX", "m2", "La protesta en Upsalón y el diálogo sobre la sexualidad", "202-246", ["El primer día de clases en Upsalón, la universidad, se convierte en una protesta estudiantil contra el gobierno. Guiados por un joven de figura «apolínea» que da las consignas, los estudiantes enfrentan a la caballería en la plaza frente a la escalinata y bajan luego por San Lázaro hasta el parque Maceo (pp. 203-206). Cemí marcha solo (p. 207). Cerca de Palacio, el jefe estudiantil lanza una soga para derribar una estatua de bronce; policías y soldados disparan y Cemí se queda paralizado, hasta que una mano lo arrastra de columna en columna: es Fronesis (p. 207). Lo acompaña Eugenio Foción, de unos veinticinco años, flaco, de pelo dorado, el más sereno de los tres (p. 207). Fronesis estudia Derecho y Filosofía y Letras; Foción no es estudiante y trabaja en la oficina de un abogado. A Cemí, Foción no le cae bien (p. 208).", "En casa, Rialta, que ha pasado la mañana rezando, le habla de la muerte del padre, ocurrida cuando ella tenía treinta años, y le dice: «No rehúses el peligro, pero intenta siempre lo más difícil» (p. 209). El narrador afirma que son las palabras más hermosas que Cemí oyó en su vida después de las de los evangelios (p. 210). Esa noche tiene una crisis de asma, quema polvos fumigatorios y lee en Suetonio la vida de Nerón; de ahí saca la palabra «neroniano» para la crueldad preconcebida sobre lo indefenso (pp. 210-212). Al día siguiente, en una librería de la calle Obispo, oye a Foción burlarse de un joven nervioso inventándole libros inexistentes, como un Goethe de James Joyce; Cemí juzga la escena «neroniana» (pp. 214-215). Esa noche ve a Fronesis y Foción conversando a solas en el recodo del Malecón y no se acerca (p. 216).", "En Upsalón, Cemí, matriculado en Derecho para complacer a su madre, se acerca a Filosofía y Letras, donde Fronesis lo llama desde su grupo (p. 216). Tras una clase sobre el Quijote, Fronesis sostiene que Don Quijote es un Simbad sin el ave que lo transporta y un San Antonio de Padua sin tentaciones, y recuerda que Cervantes coincidió en la cárcel con Mateo Alemán (pp. 217-218). Cemí critica a Menéndez y Pelayo y propone estudiar a Góngora junto al Inca Garcilaso (pp. 218-219). En la biblioteca del castillo de la Fuerza recuerda a su padre en la Cabaña y El Morro (pp. 219-220). Al día siguiente todos comentan un escándalo: el remero Baena Albornoz, que expulsaba a los homosexuales de los cafés, fue sorprendido con el novato Leregas en el sótano del castillo de la Chorrera; incendió los dormitorios de los testigos y ambos fueron expulsados (pp. 221-224).", "A propósito del escándalo, Fronesis expone que el desvío sexual es memoria de unas eras fabulosas y de una niñez que en algunos hombres nunca termina; para él el sexo no es un problema (pp. 224-225). Foción replica en un largo discurso que la homosexualidad no puede justificarse porque es más profunda que toda justificación, y que «la grandeza del hombre consiste en que puede asimilar lo que le es desconocido» (p. 226), y llama al desvío sexual una «hipertelia de la inmortalidad», búsqueda de una creación más allá de la especie (p. 228). Fronesis le contesta que nunca habla para ocultar y sabe «que hay élan vital y voluntad de muerte» (p. 232), y comenta los casos de César, Cellini y Casanova (pp. 233-235). Cuando Foción grita, Fronesis lo ofende y luego se reconcilia: es su mejor amigo, «pero eres también mi mejor inasible» (p. 236).", "Fronesis cierra diciendo que lo sexual debe verse después de la respiración y la digestión (p. 237). Llega Lucía, rubia de veinte años que busca trabajo y vive en la casa de huéspedes de una amiga de Fronesis, y se lo lleva (pp. 238-239). A solas con Foción, Cemí parte de Aristóteles, «la substancia de un ser consiste en ser lo que era» (p. 240), y de San Agustín, para quien el amor mata lo que hemos sido (p. 241), y cita a Santo Tomás: el vicio contra natura no es especie de lujuria y «no se contiene bajo la malicia, sino bajo la bestialidad» (p. 244). Foción concluye que entonces no hay pecado; Cemí responde que como bestia no resucita (pp. 244-245). Suenan disparos en una asamblea y Foción corre hacia ella (p. 245). En la escalinata, Cemí ve una procesión fálica romana (pp. 245-246)."], "Queda formado el trío Cemí, Fronesis y Foción, con sus posiciones. La consigna materna de «lo más difícil» y la expresión «hipertelia de la inmortalidad» vuelven después; en el texto la formula Foción (p. 228), aunque en pp. 245 y 254 se atribuye a Fronesis. Foción anuncia su viaje y Lucía entra en la vida de Fronesis."],
["X", "m2", "Lucía, el origen de los dos amigos y la operación de Rialta", "247-294", ["Cemí ve a Fronesis y Lucía abrazados en un banco del parque Eloy Alfaro, y por la tarde en un cine que da una versión de Tristán e Isolda (pp. 247-248). En un claro de la proyección ve a Fronesis retirar con asco la mano de Lucía y a ella sollozar; descubre además a Foción espiando a la pareja, y se marcha (p. 249). Lucía se va y Fronesis le anuncia que la buscará por la noche (p. 250). Foción ocupa el asiento vacío (p. 250). Fronesis se excusa con una mentira de ir esa noche al Malecón a despedir a Foción, que viaja al día siguiente (p. 251). Luego los tres beben en un café, donde ven a un pelirrojo de unos veinte años arrojar agua a un hombre maduro que le regalaba cepillos chinos de dientes y huir con uno (pp. 251-252).", "Esa noche Cemí encuentra a Foción solo en el recodo del Malecón, inquieto por la ausencia de Fronesis (p. 254). Cemí elogia a Fronesis (pp. 254-255); Foción dice que Fronesis es «mi demonio, mi oscurecedor, mi enemigo inconsciente, el que me destruye» (p. 256), y cuenta su origen: el padre, hijo de un diplomático cubano en Viena, se enamoró de la señorita Sunster, bailarina aficionada en la compañía de Diaghilev, que huyó con él a París y quedó embarazada de Ricardo; luego supo que ella lo usaba para seguir a Diaghilev, y que Diaghilev lo deseaba a él (pp. 257-258). El ingeniero Sunster le ofreció a su otra hija, María Teresa, para criar al niño, y se casaron en San Esteban (pp. 259-260). Foción ve en Fronesis la sangre de la fugada; Cemí sostiene que su verdadera madre es María Teresa (p. 260).", "En un apartamento prestado, Fronesis no logra la erección ante Lucía («Tápate eso, cochina», p. 261); recorta un círculo de su camiseta con un agujero en el centro, cubre con él el sexo de ella y así consuma el acto (p. 262). Foción, que viaja a Nueva York a ver a sus padres (pp. 263-264), encuentra ante su casa al pelirrojo del café y lo invita a subir (pp. 264-265). El muchacho alza un cuchillo: está harto de los hombres que lo buscan y ese día tenía que matar a alguien (pp. 266-267). Foción le muestra un círculo negro trazado en torno a su tetilla izquierda, dice que ese era el día escogido para matarse y le pide «Mátame» (p. 267). El pelirrojo baja el cuchillo y pasan la noche juntos; al amanecer Foción parte y el muchacho orina en sus zapatos y arroja su Narciso de bronce (p. 268).", "Fronesis arroja la camiseta al mar desde el muro del Malecón y se queda encogido, con la cara entre las manos; unos borrachos le gritan «Tiñosa» y un centinela lo manda a dormir (pp. 270-272). Días después, Cemí lo encuentra en la universidad hablando de Nietzsche, a quien reprocha, con Scheler, obrar desde el resentimiento (p. 273). Cemí responde con Hegel y el Espíritu Santo: «La pareja ha sido, paradojalmente, la comprobación de la autogenía» (p. 275). Fronesis defiende la compasión: «El sufrimiento no es más que la rotura del círculo en que toda criatura está inscripta» (p. 276), y ve en el porquerizo Eumeo al primero que reconoce (p. 277). En casa, Leticia insiste en llevarse a doña Augusta, que pide morir en su casa; Rialta debe operarse de un fibroma, y Cemí corta la discusión, lo que le vale una mirada de odio de Leticia (pp. 280-282).", "El día de la operación, Cemí distingue ante Fronesis la amistad «relacionable o esfíngica» de la «relacionada o dialogal» (p. 283). Fronesis le cuenta que el médico Nicolás Foción se casó con Celita, amada también por su hermano Juliano, adicto al láudano; Celita se le unió un día y Juliano murió en seguida (pp. 284-287). Al encontrarlos, Nicolás enloqueció y durante veinte años atendió a pacientes inexistentes llamando a Celita «Eudoxia», su enfermera (pp. 287-288). No se sabe cuál de los hermanos es el padre de Eugenio (p. 288). Casado a los diecisiete sin consumar el matrimonio, Foción fue seducido por un periodista; sigue casado y tiene un hijo (pp. 289-291). En la clínica, Rialta ha salido bien; Santurce le muestra el fibroma de diecisiete libras, y junto a la cama hay un pastel con la tarjeta «Sus agradecidos amigos, María Teresa Sunster y Ricardo Fronesis» (pp. 292-294)."], "Los dos amigos de Cemí quedan definidos por su origen familiar, contado cada uno por el otro amigo: Fronesis, hijo de una bailarina fugada y criado por María Teresa Sunster; Foción, hijo de la locura de su padre. Foción parte de viaje, Fronesis rompe a medias con Lucía, y la salud de doña Augusta y la convalecencia de Rialta quedan pendientes."],
["XI", "m2", "El poema de Fronesis, la locura de Foción y la muerte de la abuela", "295-336", ["Una mañana de fin de curso José Cemí avanza por los pasillos de la universidad (Upsalón) «viendo delante» a su amigo Ricardo Fronesis (p. 295). El narrador contrasta el deseo de Foción por Fronesis con la amistad de Cemí, que el propio Fronesis llama «noble y esencial» frente a la de Foción, «plebeya y experimentalista» (p. 296), y repasa los linajes de ambos (pp. 297-298). Al salir de una clase sobre Pitágoras, Fronesis y Cemí recitan a dúo ante los estudiantes el simbolismo de los números del uno al siete (pp. 299-300); Cemí lo abraza para agradecerle el obsequio de unas flores a su madre (pp. 300, 307). Fronesis critica al coro moderno que solo aplaude, como Ismene ante Antígona, y habla de san Jorge y el dragón; Cemí introduce el Juicio Final y las madres lactantes, y la conversación imagina al demonio ofreciéndoles salvar a sus hijos (pp. 301-306).", "Cuando los alumnos vuelven a entrar, Fronesis, tímido, le entrega a Cemí un sobre: «Te hago este insignificante regalo» (p. 306). Dentro hay un poema escrito a mano con tinta verde, «Retrato de José Cemí», que lo llama «Thelema Cemí» y dice que «él buscaba un río y no un camino» (pp. 306-307). Con los años Cemí sabrá que Fronesis solo hizo algo así una vez en su vida (p. 307). Quiere corresponderle con una pequeña llama de plata peruana que cuelga de la leontina de su reloj, regalo de su madre, pero Fronesis ha faltado ese día a clase. Tras una noche en vela, Cemí va a su casa y le informan que ha partido a Santa Clara a pasar con su familia las vacaciones de Navidad (pp. 307-308).", "Esa noche Cemí va al Malecón y encuentra a Foción, recién llegado de Nueva York; Foción lo llama «el Habsburgo villaclareño» y decide: «Ya lo iremos a buscar» (p. 309). Cuenta su aventura neoyorquina: en el hotel lo obsesiona Daisy, una muchacha que trabaja con un anticuario de objetos chinos y lo rechaza con violencia; el mozo del elevador le aconseja acercarse a su hermano George, un estudiante de dieciocho años que admira a Hart Crane (pp. 310-312). Foción se hace amante de George; un día Daisy aparece desnuda en el cuarto, se une a su hermano y vuelve a rechazar a Foción (p. 313). Foción dice que él y Fronesis están en la misma «cuerda floja pascaliana» (p. 314).", "Foción viaja en ómnibus a Santa Clara, donde ha citado a Fronesis por carta en un café (pp. 314-315). En su lugar llega el padre de Fronesis, abogado: «Vengo a decirle que no quiero que usted ande más con mi hijo» (p. 315). Foción le contesta con dignidad, le reprocha haber huido de Diaghilev y haberse apoderado de una carta ajena, y le predice que la reacción del hijo será trágica para él; el padre se va sin despedirse (pp. 316-317). Más tarde, en La Habana, Cemí encuentra a Foción ebrio en un café, con el pelirrojo que había intentado robar al numismático; Foción diserta sobre el dios Anubis y recita versos sobre Fronesis (pp. 318-319). El pelirrojo se escabulle; Foción cuenta que la madre del muchacho le pidió protegerla del deseo incestuoso de su hijo. Luego sufre una crisis y unos hombres se lo llevan en un auto (pp. 320-321).", "Sin sus dos amigos, Cemí pasa horas fumando en su cuarto (p. 321). Compra en la calle Obispo dos estatuillas de bronce, una bacante y un Cupido con un ala atornillada, y las coloca a ambos lados de una copa de plata de Puebla; observa cómo los objetos de sus estantes forman agrupaciones (pp. 322-326). Recuerda que en una oficina de Upsalón enunció en voz alta unas leyes de los papeles perdidos y que solo Fronesis se rió (p. 327). En Santa Clara, Ricardo ha dejado de hablar con su padre y con María Teresa Sunster. En una escena entre los tres discuten sobre Foción y Diaghilev; María Teresa revela que es su tía, hermana de su madre, cuyo paradero se ignora, y que renunció a tener hijos por él. Ricardo responde que ella es su madre; el padre le ofrece un largo viaje y los tres se abrazan (pp. 327-333).", "La abuela de Cemí, doña Augusta, se debilita bajo el recuerdo de sus muertos (don Andrés, su hijo violinista, el Coronel, Alberto) y la internan en una clínica (p. 333). Cemí la visita al atardecer; le dice que su madre, Rialta, se le parece cada vez más, y la abuela le responde que él es de la familia porque sabe observar ese ritmo: «Hemos sido dictados» (pp. 334-335). Al llegar el doctor Santurce, Cemí sale y ve en el jardín del pabellón de los dementes a Foción, con uniforme blanco, dando vueltas sin cesar alrededor de un álamo; comprende que para Foción el árbol es Fronesis (p. 335). Al día siguiente la abuela cae en coma y muere tras recibir los óleos; Leticia intenta lanzarse por la baranda y Rialta abraza a sus tres hijos (pp. 335-336). Esa noche un rayo destruye el álamo, y Foción ha desaparecido (p. 336)."], "Al terminar el capítulo Cemí ha perdido la compañía de sus dos amigos: Fronesis se prepara para un largo viaje y Foción, enloquecido, desaparece; además muere la abuela Augusta. Reaparecerán el poema de Fronesis, la imagen de Foción girando alrededor del árbol y la atención de Cemí a la forma en que se agrupan los objetos."],
["XII", "m3", "Cuatro relatos que convergen en una urna de cristal", "337-365", ["En este capítulo no aparecen Cemí ni sus amigos. Se alternan, en fragmentos que se suceden sin aviso, cuatro relatos: la campaña del capitán romano Atrio Flaminio; un niño y su abuela en torno a una jarra danesa; los paseos nocturnos de un hombre que no puede dormir; y el crítico musical Juan Longo, al que su esposa mantiene dormido. El orden es este: Flaminio (p. 337), el niño (pp. 337-338), el paseante (pp. 338-340), el crítico (pp. 340-341), Flaminio (pp. 341-343), el niño (p. 343), el paseante (pp. 344-346), el crítico (pp. 347-348), Flaminio (pp. 348-350), el niño (pp. 351-352), el paseante (pp. 352-354), el crítico (pp. 354-358) y Flaminio (pp. 358-360). En el tramo final los relatos se cruzan (pp. 360-364), y una breve escena de dos centuriones cierra el capítulo (pp. 364-365).", "El capitán de legiones Atrio Flaminio (p. 337), enviado a la guerra que se reanuda en Capadocia, vence en Mileto a unos gimnastas convertidos en guerreros; cuando, en la función de circo que les exige, le lanzan sus armas, los perdona y los devuelve armados a sus casas (pp. 341-343). En Tesalia sus soldados sufren hechicerías; hace sacar a la pitia de Delfos, que muere diciendo «Piedra y pedernal», y ordena coser piedras a capas y botas y llevar pedernal al pecho, con lo que resisten a los espectros; lo nombran general supremo (pp. 349-350). En Larisa pone un guardián junto a cada muerto para que los hechiceros no los mutilen (p. 358). En el puerto de Tamesa enferma de fiebres, ordena que las tropas embarquen y muere intentando asirse a la capa de un soldado; sus jefes atan el cadáver al caballo y caen las murallas de Capadocia (pp. 358-360).", "Un niño pequeño, llegado del Canadá, juega con una pelota en casa de su abuela, a la que el texto llama una vez «la abuela María la Luna» (p. 337). De un manotazo rompe una jarra danesa; la abuela recoge los pedazos, los envuelve como un regalo y tiembla al sonar el timbre de los padres (p. 338). En el fragmento siguiente, que empieza en primera persona sin decir quién habla, la jarra está entera; el niño ya no quiere jugar y la devuelve a su repisa (p. 343). Más adelante es la criada mestiza quien la derriba con el palo de trapear (p. 351). Ese día el niño, que lleva un ropón de lana blanca y un gorro con cinta azul, descubre el traspatio, traza con carbón una raya en la pared y se duerme en la falda de la abuela; no oye el timbre de los padres (pp. 351-352).", "El paseante le cuenta a un «compadre» que a medianoche lo despiertan un sillón que se mece solo, unas carcajadas y una puerta que se abre hacia el patio (pp. 338-340). Las noches siguientes el patio parece ordenarle salir: camina hasta el anfiteatro, donde un hombre vestido de carmelita zurce una media y le muestra lo que tiene dentro: «es un huevo de marfil» (pp. 344-345). En el puerto ve a unos marineros suecos subir a su barco a un compañero apuñalado (p. 346). Otra madrugada, en un mercado, ve a un ciego y a su esposa junto a una caja de frutas con el letrero «NO SE VENDE»: ella la arma por promesa para que su marido recobre la vista, y ambos han soñado lo mismo (pp. 352-354). Junto a un foso con animales enjaulados entrevé a un niño con ropón que se aleja cuanto más se acerca (p. 354).", "Juan Longo, crítico musical viudo, se casa pronto con una mujer veinte años menor, profesora de cultura física que oculta su oficio (pp. 340-341). Aterrada por el paso del tiempo, ella lo adormece con grandes cráteras de leche; después, cuando él pasa de los setenta años, le presiona las carótidas, le tapa nariz y oídos, le enrolla la lengua con una varilla de plata y lo cubre de cera para prolongar su sueño (pp. 341, 347-348). A los ciento catorce años él sigue dormido en una urna de cristal al vacío y ella ha enloquecido (p. 354). La Asociación de críticos pide visitarlo; ella lo reanima con tambores yorubas y él dice unas frases sobre la «sonoridad completiva» (pp. 355-356). El crítico más barbado y el más imberbe vuelven, ven a la esposa apretándole el cuello, y la Asociación expone la urna en el Auditorium, donde desfila el público (p. 357).", "En su última salida, el paseante llega a un taller de cerámica, limpia jarras danesas y recibe una tarjeta con una dirección; allí le abre el niño del ropón, el mismo del foso, que toma la jarra y le da las «Gracias» (pp. 360-361). Al unirse a la procesión del Auditorium y asomarse a la urna, no ve al crítico sino al niño muerto (pp. 361-362); rueda por los escalones y se ve junto a una hoguera en una estepa de nieve (p. 362). La esposa del crítico despierta y exige ver la urna; al asomarse ve el rostro desesperado de un general romano en la agonía de Flaminio, chilla y muere, y su chillido mata al crítico (pp. 362-364). Al final, dos centuriones juegan a los dados en unas ruinas; el compás de la estatua caída de un geómetra convierte un tres en dos y los dados suman cuatro (pp. 364-365)."], "Es un paréntesis sin Cemí cuyas cuatro historias terminan reunidas en la urna de cristal del Auditorium. Conviene retener la jarra danesa, el niño del ropón, la vigilia nocturna del paseante y el empeño de vencer al tiempo y a la muerte."],
["XIII", "m4", "El ómnibus de la cabeza de toro y la llegada a Oppiano Licario", "366-381", ["Al caer la tarde, un ómnibus de La Habana se detiene por una avería: lo mueve la cabeza decapitada de un toro que gira en un círculo de acero, y se ha cansado. El conductor pide otra testa a la central, y el mecánico le reprocha no haber invertido el sentido del giro (p. 366). Mientras esperan, suben pasajeros cuyas historias el narrador cuenta una por una. El primero es un señor alto, de piel cansada, con los bolsillos llenos de monedas (p. 366). Vuelve de la casa de antigüedades El Tesoro, donde no quiso comprar unos dracmas porque su relieve estaba gastado; los auténticos de su colección, con Minerva y Pegaso, lo conservan (p. 367). El narrador lo llama desde entonces «el anticuario». Al final se sabrá que es Oppiano Licario.", "El segundo pasajero es Martincillo, ebanista que pinta gamos en sus muebles. Pasa las Navidades solo y espera en vano a una amante (p. 367-368). En un café, la saliva de su tabaco cae sobre la langosta y el rótulo «Todo muy barato» se le fragmenta en el espejo. De ahí saca «todo es sal y vinagre», que se le convierte en «TODO ES nada» (p. 369). Sube al ómnibus, cerca del anticuario. El tercero es Adalberto Kuller, poeta obsesionado con Roxana, una muchacha de casi dieciocho años que se da a otros y a él lo rechaza (p. 370). Él la insulta ofreciéndole cien pesos por una noche; ella acepta, como un trabajo pagado (p. 371). Al día siguiente él encuentra en su jardín una caja de polvos contra la filoxera que costó cien pesos, y sube al ómnibus temblando (p. 372).", "El cuarto pasajero es Vivo, un guajiro de menos de veinte años que vuelve a la casa familiar tras dejar el ejército y andar por México. Su madre, Mamita, ha muerto, y sus hermanos lo evitan (p. 372). Lupita, una mujer de cuarenta años a la que ya no visita su amante, «el sensual taoísta», lo seduce un día en que él se corta en la ducha (p. 372-373). Lo llama Vivino y lo alimenta con almuerzos y chocolate; él vive adormecido y no busca trabajo (p. 373). Su hermano mayor, Tránquilo, lo lleva a un «conguito» adivino. Este culpa a Lupita del sueño y le manda alquilar a un anticuario el acordeón de Madagascar y tocarlo desnudo (p. 373-374). En esa casa, un hombre alto, vestido de azul casi negro, sonríe al oír pedir el acordeón (p. 374).", "José Cemí, el protagonista, vuelve de casa de Chacha, una médium mestiza de la calle General Lee cuyo rostro se parece al de la Duse (p. 374-375). Cemí había conocido en el Prado a un pintor que murió poco después de una enfermedad de la sangre (p. 374). Va a verla con un magistrado y con otro pintor, amigo del muerto. Sin que se lo digan, Chacha describe al difunto como «algo así como un artista, un pintor tal vez» y añade: «En su vida tuvo tres muertes» (p. 375). Luego habla de su novia y lo retrata con un parecido que los asombra (p. 376). Al salir, recuerdan su pobreza: volvía a pie desde Santos Suárez por no tener cinco centavos. Recuerdan también cómo escuchaba a Beethoven y una cita de «El tío Goriot» que llevaba en la billetera (p. 376).", "Ya reparado el ómnibus, todos van en él. El anticuario va sentado junto a una empleada del Ten Cent del Vedado; Martincillo está de pie a su lado, Vivino lleva el acordeón, Adalberto va delante y Cemí está sentado enfrente (p. 376). Las empleadas se enseñan unos análisis médicos, y el anticuario interviene: «La vida es una red de situaciones indeterminadas». Les expone después un método para examinarse el cuerpo a sí mismas (p. 377). Se fija en el pulso de Cemí, saca de él las iniciales J. C. y siente que se ha cumplido un signo que esperaba (p. 378). Martincillo, sin dinero para el cumpleaños de su amante, le roba la bolsita de dracmas y, como no puede gastarlos, se la mete en el bolsillo a Adalberto (p. 378-379). Cemí lo ve, la recupera en una curva y la devuelve al bolsillo del anticuario (p. 379).", "El domingo, Cemí encuentra en su bolsillo una tarjeta: «Oppiano Licario le agradece la devolución de las monedas. Era un hecho esperado por mí durante más de veinte años». Lo cita en la calle Espada 615 y añade: «Conocí a su tío Alberto, vi morir a su padre» (p. 380). El mozo del elevador lo lleva por error al séptimo piso. Desde una ventana, Cemí cree ver abajo a Licario dirigiendo con un triángulo de bronce a Martincillo, Adalberto y Vivino, y diciendo «Estilo sistáltico» (p. 380-381). El mozo corrige: el del séptimo piso es Urbano Vicario, y Licario vive en la planta baja (p. 381). Licario abre sin que Cemí llame, en una sala vacía, golpea el triángulo y dice «Estilo hesicástico». Tras un breve intercambio sobre los pitagóricos, concluye: «Entonces, podemos ya empezar» (p. 381)."], "Las historias de cuatro pasajeros (el anticuario, Martincillo, Adalberto Kuller y Vivino) terminan en un ómnibus donde Cemí devuelve a Oppiano Licario sus monedas robadas. Licario había esperado ese gesto durante veinte años, conoció al tío Alberto y vio morir al padre de Cemí."],
["XIV", "m4", "La vida de Oppiano Licario, su muerte y el poema para Cemí", "382-418", ["El capítulo retrocede para contar la vida de Licario. Hacia los cuarenta años trabaja en una notaría y vive con su madre, doña Engracia, y con su hermana (p. 382). En la mesa responde con citas y comparaciones eruditas: al agua la llama «Aguada de pasajero» y al picadillo de res, «faisán rendido en Praga», y lo explica con una anécdota de Jorge Cochrane sobre faisanes y Kafka (p. 383-384). Cuando se va a la notaría, la madre teme que, si sus «adecuaciones» no llegan a un sentido final, acabe en una locura benévola o, muerta ella, en una casa de huéspedes donde se burlen de él (p. 385). La hermana recuerda que él llama a la madre «la sombra de mi extensión» y que de niño su maestro calificó un cuento suyo de «luciérnaga errante» (p. 385-386).", "Doña Engracia recuerda la visita de un examinador del tribunal de historia. El padre de Licario, que moriría meses después, se quedó en el patio siguiendo las huellas de los insectos en las begonias (p. 386). El examinador contó que había hecho a Licario preguntas absurdas. Al nombre del perro de Robespierre en Arras, Licario respondió «Brown»; a la estatura de Napoleón, «Cuatro, ocho», y a la de Luis XIV, «Cinco, dos» (p. 387-388). A una colegiala que le preguntó dónde comprar el mejor chocolate le dio una dirección de la Rue de Rivoli (p. 388). La priora dominica le preguntó «¿Cuánto miden los labios del diablo?», y él contestó «4,444 millas» (p. 389). Los examinadores lo sacaron del aula entre el temor de los demás alumnos (p. 389). Doña Engracia comenta que la priora pagó su burla con una petrificación (p. 390).", "El narrador explica entonces lo que Licario llamaba su «Silogística poética» (p. 390). Partía de la progresión matemática cartesiana: la analogía entre dos términos conocidos lleva a un tercer punto desconocido, móvil y temporal. En el caso de Robespierre, la pobreza y la castidad de sus paseos por Arras son los dos término
