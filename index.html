s, y el nombre de su perro, Brown, es el tercero, al que hay que llegar para que los otros «se visualicen y se rindan al sentido» (p. 390). Se apoyaba en un silogismo de Dante en el «De monarchia» («Todos los gramáticos corren»), en una sentencia griega sobre el tamaño del sol y en la «Teoría de los colores» de Goethe (p. 390-391). Perseguía además frases sueltas que pedían completarse (p. 391-392). Más adelante se explica su nombre: «Oppiano, de Oppianus Claudius, senador estoico; Licario, el Ícaro» (p. 394).", "En casa de Jorge Cochrane, Licario presenta su «Cubilete de cuatro relojes». Cada invitado escoge dos versos de un soneto sobre relojes y anota una hora en secreto, y Licario la adivina (p. 392-393). Acierta con la esposa de Cochrane, que eligió a López de Zárate, y con Cochrane, que eligió a Sandoval y Zapata. Falla por un minuto con la sobrina, que se comió una sílaba al recitar a Bocángel, y acierta con su hermana, que recita a Dalibray (p. 393-394). Ese sábado, en la notaría, un bodeguero guajiro llamado Fretepsícore suelta una guinea de la que caen dos bolsas con el dinero para comprar un terreno. Luego cuenta que escondió el dinero en las alas del ave para que no se lo robara el Salado, quien llegó a quemar un cañaveral para atraparla (p. 397-399).", "El tumulto de la notaría le recuerda a Licario sus años de estudiante de religión comparada en la Sorbona. Una revuelta lo arrastró hasta la casa vacía del barón Rothschild, y allí reconstruyó la historia de una vajilla japonesa (p. 395-397). En París vivía en el hotel Gay Lussac. El 19 de junio de 1910, en una función de «Fausto», el hombre sentado a su izquierda disparó contra el palco principal y después se pegó un tiro (p. 400-403). Era Logakón, un eslavo que ocupaba el cuarto a la izquierda del de Licario. Unos conspiradores lo habían escogido para matar a quien llamaban «el Destructivo» (p. 403-405). Muerta doña Engracia, Licario vive en la azotea de su hermana, casada con un ingeniero (p. 407). Enferma de la sangre y, al morir, ve a su madre y a la vieja criada, que le dicen «A dormir, a dormir» (p. 408-409).", "Esa noche, de madrugada, Cemí camina pensando en Fronesis y en Foción (p. 409-410). Lo atrae una casa de tres pisos toda iluminada, con grupos que hablan en voz baja. Pasa junto a un parque infantil cuyo viejo cuidador acaba agitándose como un poseso (p. 410-413). Recorre un corredor con mosaicos del Grial y llega a una terraza donde dos espantapájaros vestidos de bufones juegan al ajedrez junto a un dios Término (p. 413-414). En el tercer piso lo llama la hermana de Licario: «yo sabía que usted vendría esa noche última» (p. 415). Lo lleva ante el féretro y le da el último escrito de su hermano: un poema titulado «José Cemí» que termina «Vi morir a tu padre; ahora, Cemí, tropieza» (p. 416-417). Ya en la cafetería, al golpear el vaso con la cucharilla, Cemí vuelve a oír la voz de Licario: «ritmo hesicástico, podemos empezar» (p. 417-418)."], "La conversación entre Cemí y Licario que anuncia el final del capítulo XIII nunca se narra. En su lugar el capítulo cuenta la vida de Licario (su familia, sus pruebas de adivinación, su «Silogística poética», sus años en París) y su muerte. En el velorio, la hermana de Licario entrega a Cemí un poema dedicado a él."]
],
pgroups:[["casa", "José Cemí y su casa", "El protagonista, sus padres, sus hermanas y la servidumbre que lo cría."], ["cemi", "Los Cemí, la familia paterna", "Un vasco de Bilbao, una esposa de familia inglesa y una abuela que cría al futuro Coronel."], ["olaya", "Los Olaya, la familia materna", "Emigrados a Jacksonville durante la guerra, vuelven a La Habana y se reúnen en torno a doña Augusta."], ["amigos", "Los amigos de Upsalón", "La formación de Cemí ocurre en conversación con Fronesis y Foción. Sus familias se conocen por lo que cada uno cuenta del otro."], ["licario", "Oppiano Licario y los suyos", "El maestro que cruza la novela de principio a fin."], ["episodios", "Personajes de un episodio", "Figuras que dominan uno o dos capítulos y reaparecen en el ómnibus del XIII."], ["xii", "Los cuatro relatos del capítulo XII", "Historias sin Cemí que se alternan y terminan reunidas en una urna de cristal."]],
people:[
["José Cemí", "Protagonista", "Hijo del Coronel José Eugenio Cemí y de Rialta, hermano de Violante y de Eloísa. Asmático desde niño: el libro abre con una crisis de asma y ronchas a los cinco años (I, pp. 5-11). Su padre le impone curas de agua para el asma (VI). Ve morir a su padre y a su tío Alberto (VI-VII). Termina el bachillerato, conoce a Fronesis en Santa Clara (VIII, p. 194) y entra en Upsalón a estudiar Derecho, pensando seguir Filosofía y Letras (IX, p. 216). En los diálogos argumenta desde Aristóteles, san Agustín y santo Tomás (IX, pp. 240-245). Pierde a sus dos amigos y a su abuela (XI). Devuelve las monedas robadas a Licario, que lo esperaba desde hacía veinte años (XIII), y asiste a su velorio (XIV). «Desde la muerte de su padre, Cemí asociaba toda separación a la idea de la muerte» (p. 193).", "casa"],
["José Eugenio Cemí, el Coronel", "Padre", "Hijo del vasco José María Cemí y de Eloísa. Huérfano a los diez años, lo cría su abuela doña Munda con sus tres hermanas (IV, p. 58). En el colegio se hace amigo de su vecino Alberto Olaya, hermano de su futura esposa (IV-V). Ingeniero y militar, dirige la Academia del Morro y se casa con Rialta (VI, p. 111). Es alegre, enérgico y exigente. Muere de gripe en el hospital de Fort Barrancas (Pensacola) a los treinta y tres años, con Oppiano Licario como único acompañante, a quien le pide que conozca y enseñe a su hijo (VI, pp. 139-141). Su rostro aparece en las losas cuando la familia juega a los yaquis (VII, p. 147).", "casa"],
["Rialta Olaya", "Madre", "Hija de don Andrés Olaya y de doña Augusta. Niña en Jacksonville (III, p. 36), José Eugenio la ve por primera vez en un baile (V, p. 95) y se casa con él a los veinte años (VI, p. 110). Enviuda a los treinta y vuelve a la casa de su madre en el Prado (VII, p. 178; IX, p. 208). A Cemí le deja su consigna: «No rehúses el peligro, pero intenta siempre lo más difícil» (IX, p. 209). La operan de un fibroma de diecisiete libras (X, pp. 281, 292). El narrador anuncia que con el tiempo será el centro de la familia (VII, p. 169).", "casa"],
["Violante y Eloísa", "Hermanas", "Violante, dos años mayor que Cemí, es la preferida del Coronel y se burla de su hermano con la coplilla «Pepito, Pepito» (I, pp. 6, 11). Estuvo a punto de ahogarse en la piscina del Morro (VI, p. 117). Eloísa es la menor (VI, p. 135). Las dos juegan a los yaquis cuando aparece la imagen del padre (VII, p. 146) y acompañan a Rialta tras la operación (X, p. 291).", "casa"],
["Baldovina", "Criada", "Criada española de Cerezal de Aliste, asustadiza y conversadora; de joven fue tamborilera en su aldea (I, p. 10). Cuida sola a Cemí en la noche del asma (I, pp. 5-11), duerme junto a los niños y les cuenta historias de su aldea (VI, pp. 129-130). Acompaña a la familia a Kingston y a Pensacola (II, VI).", "casa"],
["Zoar, Truni y Moña", "Servidumbre del Coronel", "Zoar, gallego corpulento, cura el asma abrazando al niño con los brazos cruzados (I, p. 9). Está casado con Truni, criada y nieta de Mamita. Moña, ordenanza «parlanchín y falso», es hermano de Truni (I, pp. 8, 21).", "casa"],
["Juan Izquierdo", "Cocinero", "Mulato, soldado en comisión y bebedor. Se jacta de dominar la cocina de cinco países (I, pp. 13-14). Alza el cuchillo ante Rialta y el Coronel lo echa a bofetadas; después lo readmite (I, pp. 14-19).", "casa"],
["Mamita y sus nietos", "Protegidos del Coronel", "Mamita, una anciana hilandera venida de Sancti Spíritus, rescata a Cemí en el solar (II, p. 21) y el Coronel la hace conserje de la escuela del campamento (II, p. 29). Tránquilo, su nieto domador, sirve en casa del capitán Viole, cuya hermana Luba lo acosa, y muere de tuberculosis (II, pp. 24-27). Vivo, el menor, escapa del campamento y reaparece en Taxco (II, p. 34). Ya mayor, toma el ómnibus del XIII.", "casa"],
["José María Cemí, el vasco", "Abuelo paterno", "Nacido en Bilbao, dueño del ingenio Resolución en Santa Clara (I, p. 17). Se casa a los treinta y siete años con Eloísa, de diecisiete (IV, p. 61). Cuando ella muere, toma su muerte como una injusticia de Dios —«ha sido injusticia de Dios» (p. 62)— y se deja destruir (IV, pp. 62-63). En el capítulo I aparece en su fiesta familiar, recordada «desde el recuerdo» (pp. 16-19).", "cemi"],
["Eloísa", "Abuela paterna", "Madre del Coronel, hija de doña Munda, de una familia de descendientes de ingleses dedicada al tabaco (IV, p. 61). Delicada, con asco por los alimentos oscuros. Muere de tifus en Viñales, en casa de su hermana Enriqueta (IV, pp. 61-62).", "cemi"],
["Doña Munda", "Bisabuela, abuela materna del Coronel", "Madre de Eloísa y de Luis Ruda. Cría a José Eugenio y a sus tres hermanas, administra su pensión y le cuenta la historia del vasco (IV, pp. 59-63). Lo manda pupilo al colegio (IV, pp. 69-70) y prepara su boda (VI, p. 109).", "cemi"],
["Luis Ruda", "Tío del Coronel", "Hijo de doña Munda, rústico, presumido y aficionado a la ópera; vive de la pensión de los sobrinos. José Eugenio lo humilla con el desafío del reloj (IV, pp. 58-60). Su madre lo manda a trabajar a Veracruz (IV, pp. 69-70).", "cemi"],
["Coronel Méndez Miranda", "Pariente del Coronel", "Primo hermano de la madre de José Eugenio, separatista herido en una conspiración. Es padrino de Rialta en la boda (VI, p. 110).", "cemi"],
["Doña Augusta", "Abuela materna", "Esposa de don Andrés Olaya y madre de Andresito, Alberto, Rialta y Leticia. Matancera, dulcera, católica y de palabra viva (I, pp. 11-13; III, pp. 38-39). Para el Coronel huérfano fue «también un poco su madre» (IV, p. 58). Gobierna la casa del Prado y preside la gran cena del VII, con casi ochenta años y un carcinoma que el doctor Santurce revela (pp. 168-169). Se resiste a que Leticia se la lleve a Santa Clara (VIII, X). Muere en una clínica tras recibir los óleos (XI, p. 336).", "olaya"],
["Don Andrés Olaya", "Abuelo materno", "Fue secretario del millonario Elpidio Michelena, de cuya ruina salió enriquecido, y emigró a Jacksonville (III, pp. 43-50). Es lento, irónico y comprensivo con sus hijos. Convence a Augusta de que Andresito toque en la tómbola donde muere (III, pp. 52-54). En La Habana invita a José Eugenio a estudiar con Alberto: «Matemática, música y chocolate» (V, p. 100). Muere a los cuarenta y cuatro años, antes de la boda de Rialta (VI, pp. 110, 141).", "olaya"],
["Alberto Olaya", "Tío materno", "Segundo hijo de los Olaya, malicioso y burlón. En Jacksonville espía a los vecinos y canta coplas, y lo mandan de vuelta a La Habana (III, pp. 55-57). Compañero de colegio de José Eugenio, su «primer y más suscitante amigo» (IV, p. 64). Se fuga del colegio y pasa una noche errante en la que lo protege un joven, Licario sin nombre todavía (V, pp. 86-92). Ya adulto, es un bebedor de gran ingenio: la carta de los peces y la partida de ajedrez (VII, pp. 153-160). Muere al amanecer cuando un tren arrolla su auto (VII, p. 178).", "olaya"],
["Andresito Olaya", "Tío materno", "Primer hijo de los Olaya, violinista tímido (III, pp. 37, 41-42). A los quince años toca a Bach en la tómbola de los emigrados en Jacksonville y muere al ceder la baranda mal clavada del elevador (III, pp. 50, 54).", "olaya"],
["Leticia y el doctor Santurce", "Tía materna y su esposo", "Leticia, hermana de Rialta, casada sin amor con el doctor Santurce, médico de Santa Clara mayor que ella, vive resentida en provincia (VIII, p. 192). Es nerviosa y dominante: humilla a Rialta por una deuda (VII, p. 161) y presiona para llevarse a doña Augusta (VIII, X). Cuando su madre muere intenta lanzarse por la baranda y Santurce la sujeta (XI, p. 336). Santurce, pedante, pierde al ajedrez con Alberto (VII, p. 160), aconseja operar a Rialta y le muestra a Cemí el fibroma: «Sólo las madres saben mirar» (X, pp. 293-294).", "olaya"],
["Demetrio y Blanquita", "Tío abuelo materno y su esposa", "Demetrio, hermano menor de doña Augusta, es dentista. José Eugenio lo apoda Guasa Bimba y casi lo hiere de un disparo (VI, pp. 112-115). Fracasa en Isla de Pinos y se casa con Blanquita, coima de un billar, mestiza y bondadosa (VII, pp. 149-150). Lee en voz alta la carta de Alberto (VII) y vive atormentado desde su muerte (IX, p. 213).", "olaya"],
["Mela y Cambita", "Bisabuelas maternas", "La vieja Mela, madre de don Andrés, es asmática y separatista: escondió trescientos rifles para los insurrectos y regaló el violín a Andresito (III, p. 42; VI, pp. 102-107). Rialta dice que el asma de Cemí viene de ella (VI, p. 118). Doña Carmen Alate, «la Abuela Cambita», madre de Augusta e hija de un oidor, muere en Jacksonville con un anillo que su mano no suelta (III, pp. 41, 56-57).", "olaya"],
["Carmen, Matilde y el doctor Zunhill", "Otras hijas de los Olaya", "Carmen es hija de doña Augusta y novia del doctor Zunhill, un médico militar que enloquece, mata a su ordenanza e intenta matarla (V, pp. 98-100). Matilde, la hermana más joven de Alberto, solo se menciona en el VII (p. 153), donde la lista de hermanas no incluye a Carmen.", "olaya"],
["Ricardo Fronesis", "Amigo", "Joven de Santa Clara, de ojos verdes, cortés y de dignidad estoica (VIII, pp. 194, 197). Cemí lo conoce en casa de Leticia: «Sintió el nacimiento de la amistad» (p. 197). En la protesta de Upsalón lo rescata y le presenta a Foción (IX, pp. 207-208). En los diálogos se niega a hacer del sexo un problema y dice saber, «como monsieur La Palisse», que hay élan vital (IX, p. 232). Frente a Nietzsche defiende el sufrimiento y la compasión (X, p. 276). Su noche con Lucía termina con la camiseta recortada arrojada al mar (X, pp. 262, 270). Le escribe a Cemí el poema «Retrato de José Cemí» (XI, pp. 306-307). Al saber que María Teresa Sunster no es su madre biológica, la reconoce como madre y parte de viaje (XI, pp. 332-333).", "amigos"],
["Eugenio Foción", "Amigo", "Mayor que Cemí y Fronesis, flaco y de pelo dorado. No estudia: trabaja en la oficina de un abogado y viaja a Nueva York, donde viven sus padres (IX, pp. 207-208; X, pp. 263-264). Es irónico y cruel con los débiles (IX, pp. 214-215). Defiende la homosexualidad y llama al desvío sexual «hipertelia de la inmortalidad» (IX, p. 228). Está enamorado de Fronesis, al que llama su mejor amigo y el que lo destruye (IX, p. 232). Tras una crisis en un café lo internan (XI, pp. 318-321). Cemí lo ve girar alrededor de un álamo en el pabellón de los dementes; un rayo destruye el árbol y Foción desaparece (XI, pp. 335-336).", "amigos"],
["La familia de Fronesis", "Según el relato de Foción", "El padre, abogado de Santa Clara e hijo de un diplomático en Viena, se fugó en su juventud con la señorita Sunster, una bailarina del coro de Diaghilev, que dio a luz a Ricardo. Luego se casó con la hermana de ella, María Teresa Sunster, para criar al niño como suyo (X, pp. 257-260). En el XI el padre exige a Foción que se aleje de su hijo (pp. 315-317), y María Teresa revela que renunció a tener hijos para que Ricardo fuera el único (pp. 332-333).", "amigos"],
["La familia de Foción", "Según el relato de Fronesis", "La madre, Celita, estaba casada con el médico Nicolás Foción y se unió a Juliano, el hermano de este, que murió. Nicolás enloqueció y pasó veinte años dando consultas a pacientes inexistentes, con Celita haciendo de enfermera «Eudoxia». Eugenio puede ser hijo de cualquiera de los dos hermanos (X, pp. 284-291). El relato contradice en parte lo que se dice de los padres de Foción en Nueva York.", "amigos"],
["Lucía", "Amante de Fronesis", "Rubia de veinte años que vive en una casa de huéspedes. Persigue a Fronesis (IX, pp. 238-239) y, tras un rechazo en el cine, pasa con él la noche de la camiseta (X, pp. 249, 261-263).", "amigos"],
["El pelirrojo", "Conocido de Foción", "Muchacho de unos veinte años huido de su casa. Amenaza a Foción con un cuchillo, pasa la noche con él y destroza el cuarto al encontrarse solo (X, pp. 264-268). Reaparece bebiendo con Foción en el XI (pp. 318-320).", "amigos"],
["Farraluque y Leregas", "Compañeros de colegio", "Protagonizan los episodios de iniciación sexual del colegio (VIII, pp. 180-191). Leregas reaparece en Upsalón, sorprendido con el remero Baena Albornoz en el castillo de la Chorrera (IX, pp. 221-224).", "amigos"],
["Oppiano Licario", "El maestro", "Aparece sin nombre en el V: un joven del bar que traduce a Alberto una inscripción latina y lo protege de una burla (pp. 89-91). En el VI, convaleciente en Fort Barrancas, cuenta que estudió en Harvard y que fue amigo de Alberto; el Coronel moribundo le encarga conocer a su hijo: «Me llamo Oppiano Licario» (p. 139). Reaparece sin nombre en el café la noche de la muerte de Alberto (VII, p. 168). En el XIII es el anticuario del ómnibus a quien Cemí devuelve sus dracmas: «Conocí a su tío Alberto, vi morir a su padre» (p. 380). El XIV cuenta su vida: empleado de notaría, vive con su madre y su hermana, estudió religión comparada en París y elaboró una «Silogística poética» que busca un tercer punto desconocido (p. 390). Su nombre viene de Oppianus Claudius, «senador estoico», y de Ícaro (p. 394). Muere de una enfermedad de la sangre en un cuarto de azotea (pp. 407-409).", "licario"],
["Ynaca Eco Licario", "Hermana de Licario", "Recuerda en el almuerzo familiar los dichos de su hermano (XIV, pp. 383-386) y luego se casa con un ingeniero, en cuya azotea vive Licario (p. 407). En el velorio entrega a Cemí el último poema de su hermano: «Vi morir a tu padre; ahora, Cemí, tropieza» (p. 417). El nombre Ynaca Eco solo aparece en el velorio (p. 416); en las escenas anteriores es «la hermana».", "licario"],
["Doña Engracia de Sotomayor", "Madre de Licario", "Criolla atenta a la economía doméstica, teme que el método de su hijo acabe en locura o en burla (XIV, p. 385). Su muerte lo lleva a la azotea de su hermana (p. 407), y se le aparece en la agonía: «A dormir, a dormir» (p. 409).", "licario"],
["Los Squabs", "Vecinos en Jacksonville", "Florita Squabs discute con Augusta sobre destino y voluntad (III, pp. 38-39). Su hija Flery dice «Mama, a scene in Pompei», que queda como frase de la familia (p. 37). Su esposo, el organista Frederick Squabs, saca a Carlitos de su trabajo y deja mal clavada la baranda donde muere Andresito (pp. 53-54). Flery huye con Carlitos (p. 55).", "episodios"],
["Elpidio Michelena", "Patrón de don Andrés", "Millonario sin hijos que acoge al joven Andrés Olaya como secretario, tiene una amante cantante, Isolda, y se arruina. La fiesta de su finca es casi alucinatoria (III, pp. 43-49).", "episodios"],
["Grace y Thomas Ginsley", "Vecinos en Fort Barrancas", "Hijos de un teniente estadounidense. Grace atrae a Cemí a un hoyo en la arena; Thomas, celoso, lo desafía y Cemí lo derriba (VI, pp. 131-133).", "episodios"],
["Godofredo el Diablo, Pablo y Fileba", "Relato de Fronesis en Santa Clara", "En el ingenio Tres Suertes, Godofredo, despechado, lleva a Pablo a descubrir a su esposa Fileba con el padre Eufrasio. Pablo se degüella y Godofredo, al huir, pierde un ojo y la razón (VIII, pp. 195-201).", "episodios"],
["Martincillo, Adalberto Kuller y Vivo", "Pasajeros del ómnibus", "Vecinos del solar de Mamita en el II, cada uno tiene su episodio en el XIII. Martincillo, el flautista, llega a la frase «TODO ES nada» (pp. 367-369). Adalberto paga cien pesos por una noche con Roxana (pp. 370-372). Vivo cae en la somnolencia de Lupita y un adivino le manda alquilar un acordeón (pp. 372-374). En el ómnibus Martincillo roba las monedas del anticuario (p. 379).", "episodios"],
["Chacha", "Médium", "Espiritista de la calle General Lee a la que Cemí consulta por un amigo pintor muerto (XIII, pp. 374-376).", "episodios"],
["Logakón", "Vecino de Licario en París", "Eslavo de puntería excepcional, alojado junto a Licario en el hotel Gay Lussac. Unos conspiradores lo empujan a un atentado en una función de Fausto, tras el cual se suicida (XIV, pp. 403-405).", "episodios"],
["Atrio Flaminio", "Capitán romano", "Vence a los gimnastas de Mileto y a las hechicerías de Tesalia y es nombrado general supremo (XII, pp. 341-350). Muere de fiebres y su cadáver, atado al caballo, encabeza la toma de Capadocia (pp. 358-360).", "xii"],
["El niño de la jarra danesa", "Niño visitante", "Niño de unos tres años, llegado del Canadá, que rompe en casa de su abuela una jarra danesa que en otro fragmento aparece intacta (XII, pp. 337-338, 343). El paseante le lleva una jarra y luego lo ve muerto en la urna (pp. 361-362).", "xii"],
["El paseante nocturno", "Desvelado", "Hombre sin nombre que sale a caminar de madrugada por La Habana. Su procesión «enroscada tres veces en torno al parque» «liberaba la extensión» (XII, p. 361). Termina junto a una hoguera en una estepa de nieve (p. 362).", "xii"],
["Juan Longo y su esposa", "Crítico musical y su mujer", "La esposa, profesora de cultura física veinte años menor, mantiene dormido al crítico durante décadas por miedo al tiempo. A los ciento catorce años lo exponen en una urna en el Auditorium: «El tiempo destruido sólo mostraba el sueño y la locura» (XII, p. 355). Ella muere tras ver en la urna el rostro de un general romano, y él al oír su chillido (p. 364).", "xii"]],
threads:[["El asma y el aliento","«Cada sueño que no puede contar lo ahoga, ahí está ya el asma» (p. 118).",["I","VI","IX"]],
 ["La muerte como herencia","Cada muerte queda ligada a una comida, una frase o un objeto: la familia se sostiene por lo que repite.",["III","IV","VI","VII","XI","XIV"]],
 ["La mesa","La comida es la forma en que la casa piensa.",["I","VII","XIV"]],
 ["La imagen y lo invisible","Se mira por persianas y rendijas. «Lo invisible ocupaba el primer plano en lo visible» (p. 297).",["IV","VII","XI","XIII"]],
 ["El círculo","El álamo y la «eternidad circular», el ómnibus que «cierra un círculo», las vueltas al parque.",["X","XI","XII","XIII"]],
 ["La tríada","El conjuro trinitario, «la tríada pitagórica» de los amigos, el tercer punto de Licario.",["I","X","XI","XIV"]]],

function daysLeft(){return Math.ceil((new Date(2026,9,31,8)-new Date())/864e5)}
function hoursLeft(){var h=0;ST.forEach(function(s){if(!S.done[s.id]){var m=s.meta.join(" ").match(/([\d,]+) horas?/);if(m)h+=parseFloat(m[1].replace(",","."))}});return h}

function viewMapa(){
  var pct=Math.round(donecount()/ST.length*100), d=daysLeft();
  var h='<section class="hero"><div class="eyebrow">Seminario Fronteras entre filosofía y literatura'+(window.RUTA_LOCAL?' · Prof. Adolfo Chaparro':'')+'</div>';
  h+='<h1>Ruta hacia la ponencia</h1>';
  h+='<p class="lead">Deleuze, <em>El bergsonismo</em>, cap. V: «El impulso vital como movimiento de la diferenciación», en diálogo con Lezama Lima y con la multiplicidad de Riemann. Recorre las estaciones en orden: cada una te dice qué leer, te explica lo esencial, te deja comprobar lo que entendiste y guarda tus notas.</p>';
  h+='<div class="stats"><div class="stat prog"><div class="ring" style="--p:'+pct+'"><i>'+pct+'%</i></div><div><b>'+donecount()+' de '+ST.length+'</b><span>estaciones completadas</span></div></div>';
  h+='<div class="stat"><b>'+(d>0?d:0)+'</b><span>días para el sábado 31 de octubre</span></div>';
  h+='<div class="stat"><b>'+String(hoursLeft()).replace(".",",")+' h</b><span>de lectura pendiente</span></div></div></section>';
  h+='<section class="map"><h2>El mapa</h2><p class="hint">Haz clic en una estación. Las primeras cuatro son el corazón de la ponencia.</p><div class="line">';
  ST.forEach(function(s){h+='<button class="node '+s.lvl+(S.done[s.id]?" done":"")+'" data-go="'+s.id+'"><span class="num">'+(S.done[s.id]?"✓":s.n)+'</span><span class="nt">'+s.short+'</span><span class="nm">'+s.lvlt+' · '+s.meta[s.meta.length-1]+'</span></button>'});
  h+='<button class="node" data-go="armar"><span class="num">★</span><span class="nt">Armar la ponencia</span><span class="nm">Al final</span></button></div>';
  h+='<div class="legend"><span><i style="background:var(--accent)"></i>Esencial</span><span><i style="background:var(--gold)"></i>Obligatoria de la sesión</span><span><i style="background:var(--teal)"></i>Recomendada</span><span><i style="background:var(--violet)"></i>Opcional</span></div></section>';
  h+='<section class="card" style="margin-top:22px"><h3>Calendario sugerido</h3><div class="concepts">'+[["13-14 oct","El capítulo V"],["15 oct","Multiplicidades y Riemann"],["16-17 oct","El Preludio"],["18-20 oct","Paradiso"],["21 oct","Materia y memoria"],["22-23 oct","Riemann y la crítica"],["24 oct","Elegir el eje y el esquema"],["25-29 oct","Redactar y cotejar citas"],["30 oct","Revisión y lectura en voz alta"]].map(function(x){return '<div class="concept"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div></section>';
  return h;
}
function tabsBar(id,tabs,cur){return '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-tab="'+id+'|'+t[0]+'" aria-selected="'+(t[0]===cur)+'"><span class="ic">'+t[2]+'</span>'+t[1]+'</button>'}).join("")+'</div>'}
function quotesHTML(qs){
  return qs.map(function(q){return '<figure class="quote"><q>«'+esc(q[0])+'»</q>'+(q[4]?'<div class="why">'+esc(q[4])+'</div>':'')+'<figcaption class="qm"><span>'+esc(q[1])+'</span><button data-copy="«'+esc(q[0])+'» ('+esc(q[1])+')">Copiar</button>'+(q[2]?'<button data-pdf="'+q[2]+'" data-p="'+q[3]+'">Ver en el PDF</button>':'')+'</figcaption></figure>'}).join("");
}
function flashHTML(s){
  if(!s.quiz||!s.quiz.length)return '<div class="card muted">Esta estación no tiene preguntas.</div>';
  var known=S.check[s.id]||{}, n=Object.keys(known).filter(function(k){return known[k]}).length;
  return '<p class="muted" style="margin:0 0 14px">Piensa la respuesta y luego toca la tarjeta para darla vuelta. Marca las que ya sabes.</p><div class="flash">'+
   s.quiz.map(function(q,i){return '<div><button class="fc" data-fc><div class="in"><div class="face front"><span class="k">Pregunta '+(i+1)+'</span><p>'+esc(q[0])+'</p><span class="tap">Toca para ver la respuesta</span></div><div class="face back"><span class="k">Respuesta</span><p>'+esc(q[1])+'</p></div></div></button><label class="selfscore"><input type="checkbox" data-know="'+s.id+'|'+i+'"'+(known[i]?" checked":"")+'> Ya lo sé</label></div>'}).join("")+
   '</div><p class="muted" style="margin-top:12px">Sabes '+n+' de '+s.quiz.length+'.</p>';
}
function notesHTML(s){return '<div class="card"><h3>Tus notas</h3><textarea data-note="'+s.id+'" placeholder="'+esc(s.ph)+'">'+esc(S.notes[s.id]||"")+'</textarea><div class="saved" id="sv-'+s.id+'"></div></div>'}

function viewStation(s){
  var tab=S.tab[s.id]||"entiende";
  var h='<section class="station"><div class="sthead"><div class="bignum '+s.lvl+'">'+s.n+'</div><div><div class="eyebrow">Estación '+s.n+'</div><h2>'+s.t+'</h2><div class="badges"><span class="badge '+s.lvl+'">'+s.lvlt+'</span>'+s.meta.map(function(m){return '<span class="badge">'+m+'</span>'}).join("")+'</div></div></div>';

  h+='<div class="pdfrow"><button class="btn pri" data-pdf="'+s.pdf[0]+'" data-p="'+s.pdf[1]+'">Abrir el texto al lado</button>'+(s.pdf2?'<button class="btn" data-pdf="'+s.pdf2[0]+'" data-p="'+s.pdf2[1]+'">'+s.pdf2[2]+'</button>':'')+(s.resumen?'<a class="btn" href="'+s.resumen+'" target="_blank">Ficha complementaria</a>':'')+'</div>';

  h+=tabsBar(s.id,tabs,tab);

    if(s.versus)h+='<div class="versus"><div class="col a"><h4>'+s.versus.a[0]+'</h4><ul>'+s.versus.a[1].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div><div class="vs">frente a</div><div class="col b"><h4>'+s.versus.b[0]+'</h4><ul>'+s.versus.b[1].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div></div>';
    h+='<div class="card"><h3>Conceptos que vas a encontrar</h3><div class="concepts">'+s.concepts.map(function(c){return '<div class="concept"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'}).join("")+'</div></div>';
    h+='<div class="card"><h3>El recorrido en breve</h3><div class="prose">'+s.guide.map(function(g){return '<p><strong>'+g[1]+'.</strong> '+g[2]+'</p>'}).join("")+'</div></div>';
  } else if(tab==="lee"){
    h+='<div class="card"><h3>Lee con esta guía</h3><p class="muted" style="margin-top:0">Cada tramo dice qué buscar. El botón abre el PDF al lado, en la página.</p><ol class="guide">'+s.guide.map(function(g,i){return '<li><span class="gd">'+(i+1)+'</span><div class="gp">'+g[0]+'</div><div class="gh">'+g[1]+'</div><p class="gx">'+g[2]+'</p>'+pdfBtn(g[4]||s.pdf[0],g[3])+'</li>'}).join("")+'</ol></div>';
  } else if(tab==="citas"){
    h+=(typeof analysisSourcesHTML==="function"?analysisSourcesHTML(s.id):"");
    if(s.quotes.length)h+=quotesHTML(s.quotes);
  } else if(tab==="comprueba"){ h+=flashHTML(s); }
  else if(tab==="notas"){ h+=notesHTML(s); }
  return h+footHTML(s);
}
function footHTML(s){
  var i=ST.indexOf(s), prev=i>0?ST[i-1]:null, next=i<ST.length-1?ST[i+1]:null;
  return '<div class="foot"><label class="donebox"><input type="checkbox" data-done="'+s.id+'"'+(S.done[s.id]?" checked":"")+'> Estación completada</label><div class="pdfrow">'+(prev?'<button class="btn" data-go="'+prev.id+'">← '+prev.short+'</button>':'<button class="btn" data-go="mapa">← Mapa</button>')+(next?'<button class="btn pri" data-go="'+next.id+'">'+next.short+' →</button>':'<button class="btn pri" data-go="armar">Armar la ponencia →</button>')+'</div></div></section>';
}
function viewParadiso(s){

    if(typeof analysisHTML==="function")h+=analysisHTML(s.id);

    h+='<div class="card"><h3>La edición</h3><p style="margin:0">La Habana, Ediciones Unión, 1966. El ejemplar digital de referencia sitúa la novela en las pp. 5–418 y contiene un extenso aparato de notas posterior. La numeración usada aquí corresponde a ese ejemplar y no debe atribuirse automáticamente a la primera edición ni trasladarse a otras ediciones.</p></div>';

    h+='<div class="tree"><div class="fam c"><h4>Los Cemí</h4><div class="gen"><span class="p">El vasco José María Cemí</span><span class="p">Eloísa</span><span class="arrow">↓</span><span class="p k">José Eugenio, el Coronel</span><span class="p">sus hermanas</span></div><p class="muted" style="font-size:.9rem;margin:8px 0 0">Eloísa, de familia inglesa, es hija de doña Munda, que cría al Coronel huérfano. El vasco se deja morir tras la muerte de Eloísa (IV). El Coronel muere a los 33 años (VI).</p></div>';
    h+='<div class="fam o"><h4>Los Olaya</h4><div class="gen"><span class="p">Don Andrés Olaya</span><span class="p">Doña Augusta</span><span class="arrow">↓</span><span class="p">Andresito</span><span class="p">Alberto</span><span class="p k">Rialta</span><span class="p">Leticia</span></div><p class="muted" style="font-size:.9rem;margin:8px 0 0">Andresito muere en Jacksonville (III); Alberto en un choque con un tren (VII); Augusta en el XI. El capítulo V menciona además a Carmen y el VII a Matilde.</p></div></div>';
    h+='<div class="union"><span class="muted" style="font:400 .74rem var(--mono)">EL CORONEL + RIALTA</span><br><b>Violante · José Cemí · Eloísa</b><br><span class="muted" style="font-size:.9rem">Fuera de la familia, Oppiano Licario une a los dos lados: conoció a Alberto y vio morir al Coronel.</span></div>';
    P.pgroups.forEach(function(g){var ps=P.people.filter(function(p){return p[3]===g[0]});if(!ps.length)return;
      h+='<h3 class="pgroup">'+g[1]+'</h3>'+(g[2]?'<p class="muted" style="margin:0 0 10px">'+g[2]+'</p>':'')+'<div class="people">'+ps.map(function(p){return '<div class="person"><em>'+p[1]+'</em><b>'+p[0]+'</b><p>'+p[2]+'</p></div>'}).join("")+'</div>';});
  } else if(t==="caps"){
    var idx=P.caps.findIndex(function(c){return c[0]===S.chap}); if(idx<0)idx=0; var c=P.caps[idx];

    h+='<article class="chapcard"><div class="ch"><span class="roman">'+c[0]+'</span><h4>'+c[2]+'</h4><span class="pp">pp. '+c[3]+'</span></div><div class="prose" style="margin-top:12px">'+[].concat(c[4]).map(function(x){return '<p>'+x+'</p>'}).join("")+'<p><strong>Para retener.</strong> '+c[5]+'</p></div><div class="pdfrow">'+pdfBtn("par",parseInt(c[3]),"Leer el capítulo en el PDF")+'</div>';

  } else if(t==="ponencia"){
    h+='<div class="alert"><span class="ai">⚑</span><div>Casi todo lo conceptual lo dicen personajes que se contradicen. Cita siempre con el nombre de quien habla: no atribuyas a Lezama lo que dice Foción.</div></div>';
    h+=quotesHTML(P.pq.map(function(q){return [q[0],q[1],"par",q[2],q[3]]}));
    h+='<div class="card"><h3>Tres preguntas para pensar la novela con el cap. V</h3><div class="concepts"><div class="concept"><b>¿Convergencia o divergencia?</b><span>La diferenciación ontológica y el retorno narrativo operan en planos distintos. ¿Qué transforma cada regreso en Paradiso y hasta dónde permite compararlo con la creación?</span></div><div class="concept"><b>¿Imagen o posible?</b><span>La familia ve al Coronel muerto en las losas (VII). ¿Realización de un posible que se parece a lo que fue, o actualización de un virtual que no se le parece?</span></div><div class="concept"><b>¿Fabulación o emoción creadora?</b><span>Si la novela es fabulación, como dice la nota 36, ¿qué hace Paradiso, que termina abriendo un aprendizaje?</span></div></div></div>';
  } else if(t==="comprueba"){ h+=flashHTML(s); }
  else if(t==="notas"){ h+=notesHTML(s); }
  return h+footHTML(s);
}

var view=(location.hash||"#mapa").slice(1);
function render(){
  var s=ST.find(function(x){return x.id===view});
  app.innerHTML=s?viewStation(s):view==="biblioteca"?viewBiblioteca():view==="armar"?viewArmar():viewMapa();
  document.querySelectorAll(".toplinks .chip[data-go]").forEach(function(c){c.classList.toggle("on",c.dataset.go===view)});
  bind();
}
function go(v){view=v;if(location.hash.slice(1)!==v)history.pushState(null,"","#"+v);render();window.scrollTo({top:0,behavior:"smooth"})}
window.addEventListener("popstate",function(){view=(location.hash||"#mapa").slice(1);render()});
function bind(){
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
  document.querySelectorAll("[data-pdf]").forEach(function(b){b.onclick=function(){openPDF(b.dataset.pdf,b.dataset.p?parseInt(b.dataset.p):0)}});
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){var x=b.dataset.tab.split("|");if(x[0]==="paradiso")S.ptab=x[1];else S.tab[x[0]]=x[1];save();render()}});
  document.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){try{navigator.clipboard.writeText(b.dataset.copy).then(function(){b.textContent="Copiada";setTimeout(function(){b.textContent="Copiar"},1300)})}catch(e){}}});
  document.querySelectorAll("[data-fc]").forEach(function(b){b.onclick=function(){b.classList.toggle("flip")}});
