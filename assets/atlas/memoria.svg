<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">El pasado y su actualización</title><desc id="desc">Tres arcos indican niveles coexistentes de memoria; una dirección conduce a una imagen en el presente. Es una metáfora gráfica.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">El pasado y su actualización</text><path d="M60 110 Q280 5 490 110 M100 165 Q280 65 455 165 M150 220 Q280 125 410 220" fill="none" stroke="#176f66" stroke-width="4"/><text x="150" y="90" font-size="20" fill="#203438">Niveles del pasado</text><path d="M280 160 L280 265" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="161" y="276" width="270" height="52" rx="13" fill="#f7e9d8"/><text x="176" y="309" font-size="18" fill="#203438">Imagen en el presente</text><text x="405" y="253" font-size="17" fill="#203438">actualización</text><text x="28" y="348" font-size="14" fill="#203438">Metáfora visual · la memoria no es un depósito espacial</text></g></svg>