<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Una relación que atraviesa la serie</title><desc id="desc">Una sucesión causal horizontal se cruza con una conexión oblicua marcada como interpretación.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">Una relación que atraviesa la serie</text><rect x="34" y="96" width="140" height="52" rx="13" fill="#dfede5"/><text x="49" y="129" font-size="18" fill="#203438">Causa A</text><path d="M184 122 L245 122" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="258" y="96" width="140" height="52" rx="13" fill="#dfede5"/><text x="273" y="129" font-size="18" fill="#203438">Causa B</text><path d="M407 122 L468 122" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="481" y="96" width="130" height="52" rx="13" fill="#dfede5"/><text x="496" y="129" font-size="18" fill="#203438">Efecto</text><path d="M103 160 Q140 298 458 265" fill="none" stroke="#a75a29" stroke-width="4" stroke-dasharray="8 5"/><rect x="422" y="250" width="190" height="52" rx="13" fill="#f7e9d8"/><text x="437" y="283" font-size="18" fill="#203438">Otro vínculo</text><text x="66" y="298" font-size="21" fill="#203438">vivencia oblicua</text><text x="28" y="337" font-size="15" fill="#203438">Diagrama interpretativo · no modelo causal formal</text></g></svg>