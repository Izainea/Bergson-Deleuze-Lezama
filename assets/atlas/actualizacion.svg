<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Crear sin copiar</title><desc id="desc">Arriba, semejanza entre modelo y resultado. Abajo, un campo virtual se diferencia en varias formas.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">Crear sin copiar</text><rect x="36" y="75" width="185" height="52" rx="13" fill="#f7e9d8"/><text x="51" y="108" font-size="18" fill="#203438">Modelo posible</text><path d="M230 101 L398 101" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="410" y="75" width="180" height="52" rx="13" fill="#f7e9d8"/><text x="425" y="108" font-size="18" fill="#203438">Realización</text><text x="242" y="88" font-size="15" fill="#203438">semejanza</text><rect x="36" y="210" width="185" height="52" rx="13" fill="#dfede5"/><text x="51" y="243" font-size="18" fill="#203438">Campo virtual</text><path d="M230 236 L420 184" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M230 236 L420 284" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="430" y="158" width="165" height="52" rx="13" fill="#dfede5"/><text x="445" y="191" font-size="18" fill="#203438">Forma A</text><rect x="430" y="258" width="165" height="52" rx="13" fill="#dfede5"/><text x="445" y="291" font-size="18" fill="#203438">Forma B</text><text x="250" y="240" font-size="15" fill="#203438">diferenciación</text><text x="28" y="337" font-size="15" fill="#203438">Esquema de lectura · El bergsonismo, cap. V</text></g></svg>