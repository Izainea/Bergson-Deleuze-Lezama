<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dos preguntas, dos distinciones</title><desc id="desc">Riemann pregunta por la determinación métrica; Bergson, por el cambio de naturaleza al dividir.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">Dos preguntas, dos distinciones</text><rect x="28" y="74" width="270" height="52" rx="13" fill="#dfede5"/><text x="43" y="107" font-size="18" fill="#203438">Riemann · medida</text><rect x="342" y="74" width="270" height="52" rx="13" fill="#f7e9d8"/><text x="357" y="107" font-size="18" fill="#203438">Bergson · división</text><text x="44" y="162" font-size="21" fill="#203438">Discreto: contar</text><text x="44" y="205" font-size="20" fill="#203438">Continuo: añadir métrica</text><text x="356" y="162" font-size="19" fill="#203438">Numérico: conservar tipo</text><text x="356" y="205" font-size="19" fill="#203438">Cualitativo: transformar</text><text x="49" y="277" font-size="45" fill="#203438">≠</text><text x="104" y="272" font-size="24" fill="#203438">No son pares intercambiables</text><text x="28" y="337" font-size="15" fill="#203438">Comparación conceptual · no identidad matemática</text></g></svg>