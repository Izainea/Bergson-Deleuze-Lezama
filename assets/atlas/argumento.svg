<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">La tesis se construye y se discute</title><desc id="desc">El pasaje sostiene una interpretación; una objeción obliga a revisar y delimitar la tesis.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">La tesis se construye y se discute</text><rect x="40" y="82" width="240" height="52" rx="13" fill="#dfede5"/><text x="55" y="115" font-size="18" fill="#203438">Pasaje localizado</text><path d="M290 108 L357 108" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="370" y="82" width="230" height="52" rx="13" fill="#dfede5"/><text x="385" y="115" font-size="18" fill="#203438">Interpretación</text><path d="M484 145 L484 213" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="369" y="226" width="230" height="52" rx="13" fill="#f7e9d8"/><text x="384" y="259" font-size="18" fill="#203438">Tesis delimitada</text><rect x="40" y="226" width="240" height="52" rx="13" fill="#eee6f5"/><text x="55" y="259" font-size="18" fill="#203438">Objeción fuerte</text><path d="M290 252 L357 252" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M120 214 V151" stroke="#176f66" stroke-width="3" marker-end="url(#arr)"/><text x="28" y="337" font-size="15" fill="#203438">Método de trabajo · evidencia, alcance y revisión</text></g></svg>