<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Volver no obliga a repetir lo mismo</title><desc id="desc">Dos llamadas a comenzar aparecen en momentos distintos del aprendizaje de Cemí.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">Volver no obliga a repetir lo mismo</text><rect x="28" y="92" width="255" height="52" rx="13" fill="#dfede5"/><text x="43" y="125" font-size="18" fill="#203438">XIII · encuentro</text><rect x="354" y="220" width="255" height="52" rx="13" fill="#f7e9d8"/><text x="369" y="253" font-size="18" fill="#203438">XIV · voz que vuelve</text><text x="47" y="174" font-size="18" fill="#203438">«podemos ya empezar»</text><text x="365" y="300" font-size="18" fill="#203438">«podemos empezar»</text><path d="M285 117 C490 90 130 259 343 247" fill="none" stroke="#176f66" stroke-width="3" marker-end="url(#arr)"/><text x="316" y="72" font-size="20" fill="#203438">¿Qué ha cambiado?</text><text x="28" y="337" font-size="15" fill="#203438">Paradiso · pregunta sobre la composición narrativa</text></g></svg>