<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">El acto transforma sus condiciones</title><desc id="desc">Un circuito abierto conecta germen, acto y nueva extensión. El retorno modifica el germen.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#176f66"/></marker></defs><rect width="640" height="360" rx="20" fill="#f7f4ed"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#203438">El acto transforma sus condiciones</text><rect x="40" y="83" width="160" height="52" rx="13" fill="#dfede5"/><text x="55" y="116" font-size="18" fill="#203438">Germen</text><path d="M210 109 L385 109" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="400" y="83" width="180" height="52" rx="13" fill="#f7e9d8"/><text x="415" y="116" font-size="18" fill="#203438">Acto</text><path d="M490 144 C490 260 100 260 100 145" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="197" y="245" font-size="20" fill="#203438">reobra / transforma</text><path d="M490 250 L490 279" stroke="#176f66" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="323" y="290" width="275" height="52" rx="13" fill="#dfede5"/><text x="338" y="323" font-size="18" fill="#203438">Nueva extensión</text><text x="28" y="337" font-size="15" fill="#203438">Lectura del Preludio, pp. 383–384</text></g></svg>